    choose_general.run_number:
        1:
            # REcoM cold start: no bio restart to read or stage
            recom_restart_flag: false
            remove_restart_in_files: [par_bio_restart]
            remove_restart_in_in_work: [par_bio_restart]
            remove_restart_in_sources: [par_bio_restart]
        "*":
            recom_restart_flag: true

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 2   # one node instead of four, no slowdown (TEST_ccP)
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_PICALforcing_ndep1850"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/albedo/scratch/projects/p_awiesm3_cmip7/jstreffi/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_PICALforcing_ndep1850/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*   # 1280 rank files + meta.bin; the reader takes the rank count from meta.bin
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 192    # 36-node layout
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            NAMGFL:
                # INIUA carries present-day CO2 (~403 ppm, paramId 210061); start the diagnostic
                # tracer at 1850 instead: 4.3144e-4 kg/kg ~ 284 ppm.
                YGHG_NL(1)%NREQIN: -1
                YGHG_NL(1)%REFVALI: 4.3144e-4
                # proportional mass fixer; the additive one (2) divides by ~0 for a uniform field
                YGHG_NL(1)%BETAMFBC: -1

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600
    # trailing slash required (oasis.py builds f"{ini_restart_dir}{file}*{date}")
    ini_parent_exp_id: "coldstart"
    ini_parent_date: "1849-12-31"
    ini_restart_dir: "/albedo/work/projects/p_awiesm3_cmip7/jstreffi/input/oasis_ini/cc_mslp_coldstart_dist2688/"   # README.txt there

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 4
    interleave_into: [oifs]
    ranks_per_node: 3
    compression_level: 3

rnfmap:
    version: "v1.4"   # IgnoreCalvingBasins: Antarctic calving goes to the icebergs, not to the mapper
    bin_sources:
        bin: "/albedo/scratch/user/jstreffi/model_codes_v350/awiesm3-develop-is/bin/rnfma"
    omp_num_threads: 4
    interleave_into: [oifs]
