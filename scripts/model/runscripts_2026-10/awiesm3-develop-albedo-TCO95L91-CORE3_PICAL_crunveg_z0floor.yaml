oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600
    # Branch-off source for rstas.nc / rstos.nc / vegin.nc.  Without these three
    # keys oasis.py has no ini_restart_dir to build its glob from and the run 1
    # branch-off cannot find the parent's coupler restarts: it looks only in this
    # experiment's own (empty) restart folder.  fesom and lpj_guess carry the same
    # keys in their own sections; prepare.py only fans a setup-level ini_parent_dir
    # out to the models, and there is none here.
    #
    # The trailing slash is REQUIRED: oasis.py builds the search as
    # f"{ini_restart_dir}{restart_file}*{YYYY}{MM}{DD}" with no separator, so
    # without it the glob is malformed.  The date 2099-12-31 matches the parent's
    # rstas.nc_20900101-20991231 and its two siblings.
    #
    # This directory deliberately holds no rmp_*.nc.  A parent restart/oasis3mct
    # carrying them would stage them too and shadow the nproc-keyed weight lookup,
    # silently putting every coupled field on the wrong node.
    ini_parent_exp_id: "PICAL_crunveg_tke_albsn082"
    ini_parent_date: "2169-12-31"
    # gmhemi1800's end-of-2139 rstas/rstos/vegin under dated names, with the dist_768 weights it ran with
    # (README.txt there; the two rst_co2_* files in it belong to PICAL_cc and are not read here).
    ini_restart_dir: "/albedo/work/projects/p_awiesm3_cmip7/jstreffi/input/oasis_ini/from_tke_albsn082_2169/"

xios:
    # xios.x from the scratch tree, under the xios_dbg.sh wrapper that xios.yaml sets on albedo (as in the control)
    with_model:
        - oifs
        - fesom
    nproc: 16
    # INTERLEAVED INTO THE OIFS NODES from 2026-09-29 (esm_tools taskset placement,
    # feat/awiesm3-v3.4-co2 >= 03ddec946, needs a venv built from it): 4 cores per
    # server at the end of an OIFS node, 2 servers per node. Not 4 per node: the
    # largest server peaked at 44-46 GB per 10-year leg, and 4 of them next to 28
    # OIFS ranks (~3 GB each) would exceed the 256 GB of a node late in a leg.
    omp_num_threads: 4
    interleave_into: [oifs]
    ranks_per_node: 2
    compression_level: 3

rnfmap:
    # One rank, interleaved into an OIFS node (4 cores) instead of a node of its own,
    # from 2026-09-29 (esm_tools taskset placement, as for xios).
    omp_num_threads: 4
    interleave_into: [oifs]
