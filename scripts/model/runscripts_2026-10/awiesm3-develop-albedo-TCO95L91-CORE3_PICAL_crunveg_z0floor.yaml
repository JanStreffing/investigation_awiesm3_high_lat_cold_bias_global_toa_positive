lpj_guess:
    # NEW LAND LINEAGE, 2026-09-21. Three things that only work together:
    # the capped peat map (v3.5 default, nothing set here), LPJ-GUESS line A at
    # 13a4a06 with the LUH3 crop mix, and an LPJ-GUESS state corrected to both.
    # Runs from before that day use the uncapped map, an equal split of cropland
    # over ten stand types (50% irrigated against 5.5% in LUH3 1850) and the
    # binary guess.4111_softinit_gssmar_20260908. They are not comparable with
    # this one over land. See notes/LPJG_PEAT_INVARIANT_20260921_REPLY.md.
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    # 4 -> 8 on 2026-09-19: leg 1970 (job 27549347) lost rank 2216 to an OOM kill
    # during LPJ-GUESS startup, the first in this run's history. Doubling the
    # threads per task halves the tasks packed onto each node, which doubles the
    # memory each rank gets. Task count is unchanged, so the decomposition and
    # the results are not affected.
    omp_num_threads: 8
    lresume: true
    ini_parent_exp_id: "PICAL_crunveg_tke_albsn082"
    ini_parent_date: "2169-12-31"
    # PICAL_momixoff lpjg_state_1940 corrected to LUH3 1850 crop mix and the capped
    # peat map. a270270's correction chain, validator PASS for all 10157 cells.
    # THE POINT OF THIS RUN: the land does NOT come from PICAL_ccnice. It comes
    # from the offline CRUNCEP spin-up end state, which still has a boreal forest.
    ini_restart_dir: "/albedo/work/projects/p_awiesm3_cmip7/jstreffi/runtime/awiesm3-v3.4/PICAL_crunveg_tke_albsn082/restart/lpj_guess/"
    choose_general.run_number:
        1:
            restart_in_sources:
                # a270270's CRUNCEP spin-up END state (3901) migrated to the active
                # TCO95-land grid (10157 cells: 10046 retained, 111 initialised bare;
                # lpjg_state_3850 on the old L096 grid cannot load, the restart cell set
                # must equal the active set). _CFT: crop stand types repartitioned to the
                # LUH3 3-1-2 / 1850 target with corrected Lund peat, same table as the
                # momixoff 1940 state, run 2026-09-27 on levante (lpjg_peat_migration_LR,
                # job 27736804). Without it the fixed-LU startup check aborts.
                state: /${ini_restart_dir}/lpjg_state_2170/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
