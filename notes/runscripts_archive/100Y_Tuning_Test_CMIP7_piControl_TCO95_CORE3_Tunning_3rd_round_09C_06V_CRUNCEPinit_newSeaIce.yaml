# AWI-ESM3 CMIP7 piControl - TCO95-CORE3 - 3rd Round TUNING TEST (09C)
# =============================================================================
# Variant V on the NEW SEA-ICE THERMODYNAMICS:
#   06T (1-hour coupling + MOSPP + reduced KPP mixing) + ENTSTPC3=1
#   on FESOM 2.7 `awiesm3-implicit-ice-surftemp` + OIFS `movcav-landice+co2-concdriven`
#
# Why this run exists
# -------------------
# Round 09 pairs FESOM's implicit ice-surface-temperature solve with the OpenIFS
# coupled-slab ice tile (OASIS now carries a 6th o2a field, sit_feom ->
# A_Ice_thickness, so OpenIFS owns the ice surface energy balance and FESOM ice
# growth is driven by Qatmice = -a2ihf). Two 09 runs exist already:
#   09A = baseline physics + newSeaIce (50 yr)
#   09B = 06T             + newSeaIce (30 yr)
# but NOT 06V -- which is the best radiation branch in the whole campaign
# (08B reached 0.93 W/m2 last-decade vs 06T's ~1.18, against an HR goal of
# -0.16). Since the new ice thermodynamics change exactly the surface energy
# balance both branches lean on, 06V is the branch most likely to behave
# differently under it. This run closes that gap and is directly comparable to
# 09B (same 30-yr window, same restarts, same everything but ENTSTPC3).
#
# Acceptance criteria are the campaign's two joint objectives:
#   1. global net radiation moves toward zero (last-decade net TOA vs 09B/08B)
#   2. boreal LAND climate does not degrade -- specifically the Siberian /
#      East-Siberian JJA cold bias, which the 08 round showed 06V worsens to
#      -3.1 K (Siberia JJA vs CRUNCEP3), and East-Siberian AGDD5 / TREEFPC.
#
# Build provenance (our own tree, /work/ab0246/a270092/model_codes/awiesm3-develop)
# -------------------------------------------------------------------------------
#   fesom-2.7  awiesm3-implicit-ice-surftemp @ db7dd9af  <- SAME COMMIT as the
#              colleague's 09A/09B newSeaIce build
#   oifs-48r1  movcav-landice+co2-concdriven @ f3ccacb   <- the last non-debug
#              commit on the branch; the colleague's build is most likely the
#              tip 45a7bea, which differs ONLY by the voskin diagnostic probes
#              added for the friction-velocity overflow hunt. Deliberately not
#              carrying debug probes into a production branch; note the delta
#              when comparing against 09A/09B.
#   lpj_guess  lpj_guess_awiesm3 @ 2e9ce65
#
# Derived from a270270's 09B runscript; the only physics difference is
# ENTSTPC3=1. Paths repointed to our own model tree and runtime.
# =============================================================================

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1380-01-01"  # 30 years -- matches 09B for a clean 06T-vs-06V pair
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09B)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPcalibrated_v3"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPcalibrated_v3/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # <-- THE ONLY PHYSICS DIFFERENCE vs 09B
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
