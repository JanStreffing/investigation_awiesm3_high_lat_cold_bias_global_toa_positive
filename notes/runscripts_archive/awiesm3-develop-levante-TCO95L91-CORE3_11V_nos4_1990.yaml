# ---------------------------------------------------------------------------------
# 11V = 11R with S4 REMOVED (RCL_INPPMIN 50000 -> 70000).  Prices dropping S4 on the
# CURRENT stack rather than inferring it from a pair taken four rounds ago.
#
# WHY REMOVE AN ADOPTED LEVER.  S4 now carries three separate charges, all measured on
# 2026-08-23/24:
#
#  1. IT BUYS NOTHING AT THE POLE.  Ocean-masked, 30 yr paired, 11G-11E: SW CRE at
#     90-60S DJF is +0.77 and NOT significant, against -2.34* at 60-45S.  A ratio of
#     -0.33: purely equatorward.
#  2. IT AUTHORED THE CONSTRAINT THAT BLOCKS EVERYTHING ELSE.  That -2.34 is the largest
#     single contribution to the sub-Antarctic overcorrection, now -3.70 W/m2 DJF, which
#     is what disqualifies DMS (-6.4 there), RCL_KK_CLOUD_NUM_SEA and every other SH-wide
#     brightening lever.  The polar deficit meanwhile stands at +13.36.
#  3. ITS HEADLINE BENEFIT DOES NOT EXIST COUPLED.  S4 was adopted for Siberian JJA, where
#     AMIP measured +1.194* K.  Coupled, 11G-11E gives -0.365* K -- the sign reverses.  So
#     do Arctic land JJA (+0.784 -> -0.262), all-land annual (+0.160 -> -0.372) and global
#     T2m (+0.070 -> -0.320).  A 0.32 K global cooling is a straight cost in a model that
#     is already ~0.7 K too cold.
#
#     The campaign knew the SO effect was weaker coupled -- the report records S4 coupled
#     as "real, resolved, and three times smaller than AMIP" -- but that was the cloud
#     radiative effect.  The Siberian JJA sign reversal appears never to have been checked,
#     and it is the metric S4 was adopted for.
#
# WHY NOT JUST TRUST 11G-11E.  That pair is four rounds old and sits on a colder, darker
# base.  S4 may behave differently on top of LX4 and RSBLB, where the Southern Ocean is
# already 8 W/m2 brighter and the land 0.5 K warmer.  Superposition in this campaign has
# been wrong in SIGN twice, which is the same failure mode that produced charge 3.  So
# this measures removal where it would actually be applied.
#
# WHAT WOULD KEEP S4.  Siberian JJA going BACKWARDS when it is removed, i.e. 11V-11R
# negative -- that would mean the coupled 11G-11E result does not transfer to this base
# and S4 is earning its place after all.  Global net TOA is the other watch item: S4
# cools, and removing it will warm, which HELPS the cold bias but spends the energy
# budget.  11R sits at net TOA -0.027 against its control, so there is little headroom.
#
# WHAT WOULD RETIRE IT.  Siberian JJA flat or improving, sub-Antarctic DJF SW CRE moving
# back toward zero from -3.70, and the polar band unchanged.  That combination would free
# roughly +2.3 W/m2 of sub-Antarctic headroom at no cost to any campaign target, and would
# reopen the SH-wide lever family that is currently blocked.
#
# CONTROL: 11R, 40 yr, same binary, branched from the same 1350 state.  One namelist
# number apart.
# ---------------------------------------------------------------------------------

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1390-01-01"  # 40 yr -> 30 clean matched years vs 11G
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    # PINNED, not the default `guess`.  This is the binary 11L, 11M, 11N, 11P, 11Q
    # and 11R all staged (md5 f687355919dc0b18b511e10560899bae, built 08-12 07:55),
    # so the comparison below is one namelist number apart and nothing else.
    # bin/guess is whatever was built last: a rebuild on 08-23 21:48 replaced it with
    # a tree carrying the hardened land-cover checks, which reject the shared 1350
    # state on physical stand sums of 1.000000003725290 against a 1e-9 tolerance --
    # the ninth decimal of a sum of ~40 stand fractions.  11V crashlooped all three
    # legs on that.  Every arm branching from 1350 would have.
    executable: guess.raupach_junebase_gated
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    # LPJ-GUESS has its OWN forcing pins, separate from NCMIPFIXYR, which controls only
    # the IFS side (GHG, ozone, solar, stratospheric aerosol, SO4, and -- via YEAR_FR --
    # MACv2SP).  Leaving these at 1850 would run 1990 climate over pre-industrial CO2,
    # nitrogen deposition and land use.
    fixed_CO2: 1990
    fixed_ndep: 1990
    # fixed_LU 1990 raises the peat-vs-LUH3 conflict count: 73 cells at 1850, 208 at 1950,
    # 493 at 2000, so ~300-400 here.  This arm runs the DEFAULT `guess` binary, which
    # predates 46e7a84 and carries no conflict check, so those cells are silently
    # over-allocated to peat exactly as they are in 11E/11G -- consistent with the rest of
    # the campaign, but a larger population than 11N's.  Do not pair 11P against 11N on
    # peat area without accounting for it.
    fixed_LU: 1990
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            # 11R: stable-BL mixing.  New namelist group; see the header.
            NAMVDFS:
                RSBLB: 2.0
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                # 11V: S4 REMOVED.  Back to the as-released 70000, i.e. the ice-nuclei
                # gate applies only below ~700 hPa again.  This is the ONLY change from 11R.
                RCL_INPPMIN: 70000.0
                RSNOWLIN2: 0.04        # 11P: LX4's lever
            NAMECECMIP:
                # Z1 verified this reaches the model from the LIVE block.  The dead
                # &NAMECECMIP6 block that 48r1 renamed still ACCEPTS the key and is
                # never read -- amip_pi_base ran 50 arms transient because of it, so
                # CHECK NODE.001_01 for 'Set JYEAR', not fort.4.
                NCMIPFIXYR: 1990
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
