# AWI-ESM3 CMIP7 piControl - TCO95-CORE3 - 11H0-CODEONLY: the discriminator
# =============================================================================
# NEW BINARIES, NO NEW COUPLING FIELD.  Identical to 11G except that the Raupach
# code is COMPILED IN and both switches are off, and Z0HVeg/GUE_Z0HV is absent from
# the namcouple entirely.
#
# WHY.  Two 1-year attempts with the field declared deadlocked with all 64 LPJ-GUESS
# ranks inside the day loop (per-rank logs: 64 reached "Simulating", 0 completed
# their MPI sends), while a healthy cold start pauses only 7 s at step 4.  That rules
# out the MPI gather and the namcouple ordering.  What is left is either the compiled
# code itself or the act of declaring the extra OASIS field.  This run separates them:
#
#   runs clean  -> the code is inert; the fault is in declaring/exchanging the field
#   deadlocks   -> the fault is in the compiled code, with the coupling irrelevant
#
# If OASIS aborts instead because LPJ-GUESS def_vars a field the namcouple does not
# carry, that is also a useful answer: it means the put must be guarded by the switch,
# which is the right design anyway.
# =============================================================================
# (original null-arm header follows)
# ---------------------------------------------------------------------------
# =============================================================================
# NOT a science run.  This is the bit-identity check for the Raupach roughness
# coupling, and its ONLY job is to prove that the new code is inert when switched off.
#
# WHAT CHANGED IN THE MODEL, and why it needs proving.  Three things were added on
# 2026-08-11 that touch code every coupled run executes:
#   * a SEVENTH LPJ-GUESS -> OpenIFS coupling field, Z0HVeg/GUE_Z0HV, put and received
#     every coupling step whether or not anything reads it;
#   * a new module-level store in SURFECE (ECE_Z0VEG_B and its set/get), allocated and
#     filled from ece_updclie_cpl;
#   * all TWELVE high-vegetation roughness lookups in vupdz0_mod.F90 rewritten to go
#     through local arrays ZZ0MHV/ZZ0HHV instead of RVZ0M(KTVH)/RVZ0H(KTVH).
# The third is the dangerous one: it is on the momentum path of every land point in every
# timestep, and a transcription slip there would be a silent physics change.
#
# THE TEST.  This runscript is 11G, byte for byte, with both switches left at their
# defaults (ifraupachz0 unset in the .ins, ECE_CPL_LPJG_Z0 absent from &NAMECECFG).  Run
# it for one year from the same initial state as 11G and compare year 1350 against 11G's
# own year 1350:
#
#   IDENTICAL to the last bit  -> the new code is inert; the Raupach arm is interpretable
#   ANY difference at all      -> a rewrite changed behaviour with the feature off, and
#                                 nothing measured against 11G means anything until it
#                                 is found.  Do NOT explain a small difference away.
#
# One year is enough: a coupling-field mismatch aborts at initialisation and a vupdz0
# error shows in the first timestep.  Cost is one leg.
# =============================================================================

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1351-01-01"  # ONE year: this is an inertness check, not science
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 1
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/CORE3"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                RCL_INPPMIN: 50000.0   # 11G: S4 -- the ONLY change from 11E
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    # -----------------------------------------------------------------------------
    # Raupach canopy-roughness coupling: LPJ-GUESS -> OpenIFS, one extra field.
    #
    # DEFINED HERE, NOT IN configs/setups/awiesm3/awiesm3.yaml, ON PURPOSE.  Putting it
    # in the shared setup file makes every awiesm3 experiment negotiate a 7-field veg
    # exchange, and any run whose staged binaries predate the field then dies in
    # OasisCoupler::abort().  That happened on 2026-08-11 and cost 11G three legs.
    #
    # APPENDED LAST, ALSO ON PURPOSE.  The LOCTRANS accumulators OASIS stores in
    # vegin.nc are named by namcouple ENTRY INDEX -- loc000011_T2MVeg,
    # loc000012_SoilTVeg.L001, and so on.  Inserting a new entry in the middle of the
    # vegin.nc list renumbers every entry after it, so on restart OASIS reads those
    # accumulators back against the WRONG fields.  The first attempt put this entry
    # directly after the six-field veg bundle; LPJ-GUESS then received scrambled soil
    # temperature and moisture on the first coupling step and four ranks aborted in
    # Soil::update_soil_diffusivities with Frac_air < 0.  Keep it last.
    # -----------------------------------------------------------------------------
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
