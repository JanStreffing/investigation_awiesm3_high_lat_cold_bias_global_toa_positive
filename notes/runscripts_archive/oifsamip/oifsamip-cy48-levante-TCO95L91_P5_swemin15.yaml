# P5 -- SWEMIN = 15.0 kg/m2.  Round 21: calibrating the AUTUMN cover against Rutgers.
#
# WHY.  P3 is adopted -- it cures the winter the tanh broke (DJF soil +0.30 K vs the
# scheme-off reference against -22.71 K for the tanh; January f_full 0.965 vs 0.961;
# soil-to-snowpack gradient 22.9 K, physical again) and it beats the scheme-off
# baseline against 105 RIHMI stations (bias -1.13/RMSE 3.12 vs -1.52/3.28).
#
# BUT Rutgers 24 km says P3 made the ACCUMULATION season substantially worse.  Model
# minus Rutgers, Siberian box, area-weighted:
#            Sep     Oct
#   N1     +0.107  +0.103     (as-released, already known to be too high)
#   P3     +0.259  +0.249     <- 2.4x worse
# Cause: the fitted d_c for fresh low-density snow is ~2 mm, so a dusting saturates.
# The snow courses say that is right at 1-2 km; Rutgers says that at grid scale
# September Siberia is 7 % covered, not 33 %.
#
# THE LEVER.  ECE_SNOW_SCF_SWEMIN floors d_c at SWEMIN/rho.  Being a floor it binds
# ONLY at low density -- at rho=300 the fitted d_c (0.097 m) already exceeds any
# plausible floor -- so it is an almost pure autumn control.  It was set to 3.0 purely
# as the numerical stability floor after the P1 crash and NEVER calibrated for its
# cover role.  SCALE is deliberately left at 1.0: P4 already tested SCALE=3 and moved
# almost nothing (offline RMSE 0.002, and P3/P4 were near-identical on soil), so
# varying it again would spend a run re-measuring a null.  One variable changes here.
#
# OFFLINE SWEEP vs Rutgers, scored over the WHOLE Sep-May snow season
# (sweep_swemin_scale.py, reconstructing cover from P3's own daily state):
#   SWEMIN     3      6     10     15     20     25     30     40     55
#   RMSE   0.139  0.119  0.099  0.081  0.065  0.053  0.045  0.049  0.072
# Interior optimum at 30; beyond it the September gain is paid for by November and
# December going DEFICIENT (max error flips sign at 40).
#
# WHY TWO RUNS.  The sweep holds SWE fixed while changing cover, but cover sets
# albedo, which sets melt, which sets SWE -- and in autumn that feedback is POSITIVE.
# The offline numbers are therefore LOWER BOUNDS on the sensitivity.  P5 (15) and
# P6 (30) bracket that: if the feedback is strong, 15 lands near optimal and 30
# overshoots into a November deficit; if weak, 30 is right.
#
# WHAT WOULD FALSIFY.  (i) DJF soil must STAY at the scheme-off reference -- at
# midwinter SWE 93 the floor is 0.075 m against a 0.43 m pack, still saturated, so this
# should be safe by construction and a failure would mean the floor is doing something
# unintended.  (ii) Sep/Oct cover must fall toward Rutgers WITHOUT Nov/Dec going
# deficient.  (iii) JJA T2m must not lose the gain P3 holds (+1.341 K vs control).
#
general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915 = 44 yr, campaign standard
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_INPPMIN: 70000.0     # D2b: only below ~700 hPa, sparing tropical anvils
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare.  Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # --- P3: the fitted depletion, taken literally at course scale ---
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014     # field / low veg, d_c at rho=200
                ECE_SNOW_SCF_DCH: 0.026     # forest / high veg
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                ECE_SNOW_SCF_SWEMIN: 15.0

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Per-run override so the shared template is untouched: adds daily
    # sd/rsn/tsn/asn/stl1/stl2.  Retained from N/O because f_full -- the fraction
    # of the box at cover >= 0.999 -- is the diagnostic that exposed the defect and
    # is the one that has to come back.
    add_config_sources:
        file_def: ${xml_dir}/file_def_snowdiag.xml.j2
