# Round 10 -- A1b + B2 + B8, the three levers that work
#   A1b RCL_OVERLAPLIQICE 0.65->0.35 (namelist)  -- energy target, best deep-water SW
#   B2  RCLDIFF_CONVI     10  ->25   (namelist)  -- boreal +0.29 K
#   B8  RVLAMSK/RVLAMSKS(3,4) 10->5 (COMPILED IN, current install/lib) -- boreal +0.50 K
#
# Tests whether the two halves compose.
#   A alone: global sfc flux -0.129, Siberia JJA T2m -0.03 K, SO SW CRE -1.89
#   B alone: global sfc flux +0.147, Siberia JJA T2m +0.29 K, SO SW CRE -0.07
#   if additive: sfc flux ~ +0.02, boreal ~ +0.26 K, SO ~ -1.96
