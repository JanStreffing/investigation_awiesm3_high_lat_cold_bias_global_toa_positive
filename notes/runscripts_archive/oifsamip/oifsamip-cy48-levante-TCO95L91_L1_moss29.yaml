# L1 -- G4 plus a MOSS/LITTER insulating layer, as a skin-conductivity
# proxy. lambda_sk 10 -> 2.9 W/m2/K on vegetation types 4 and 9 only. Round 17.
#
# WHY. Gaillard et al. (2025, PNAS) remove a >2 K high-latitude summer cold bias in
# ORCHIDEE/LMDZ. Reading their decomposition, most of it is NOT the soil-carbon
# thermal properties (0.78 K) but a SURFACE ORGANIC LAYER of moss/lichen/litter
# (1.71 K). HTESSEL has no such layer. A moss mat is thermally a thin, low-
# conductivity blanket between the atmosphere and the soil, which is what the skin
# layer conductivity lambda_sk already represents -- so lowering lambda_sk is a
# proxy for adding one.
#
# WHY NOT THE PEAT SOIL TYPE INSTEAD. Because the model is not badly wrong there:
# organic soil is 6.18 % of this box against an observed 12.5 % areal / 2.8 %
# dominant-class target, and the sensitivity works out at ~0.01 K -- far below the
# +-0.242 K floor. Moss is a different thing: it covers the boreal forest FLOOR
# essentially everywhere regardless of whether the soil below is histosol, so the
# relevant coverage is ~100 % of the box, not 6 %.
#
# VALUE, derived not fitted. A moss mat of conductivity k over depth d adds a
# resistance in series with the existing skin layer: 1/lam_eff = 1/10 + d/k.
#   litter / thin moss: k~0.2 W/m/K over ~0.05 m -> lam_moss~4, in series with the as-released 10 gives 2.9
#
# WHY ONLY TYPES 4 AND 9. ECE_TUNE_RVLAMSK* is indexed by VEGETATION TYPE, not by
# latitude, so every type leaks outside the boreal zone. Measured fraction of each
# type's global vegetated area lying equatorward of 50N:
#     type  9 Tundra            29.8 %      type 16 Evgr Shrubs   59.0 %
#     type  4 Dec Needleleaf    38.4 %      type 17 Dec Shrubs    76.7 %
#     type  3 Evgr Needleleaf   49.1 %      type 13 Bogs          57.2 %
# Types 4 and 9 are the two most boreal-confined and are nearly absent from the
# tropics. Type 3 was REJECTED despite being the archetypal boreal conifer: half
# its area is temperate/montane forest (Alps, Rockies, Pacific NW, Himalaya), and
# a global change with a boreal justification is exactly the pattern that sank
# A1a. Shrubs were rejected because their non-boreal area is semi-arid, where a
# moss insulator is not merely untargeted but physically wrong.
#
# PREDICTION: +0.2 to +0.5 K on Siberian JJA T2m. A less conductive skin decouples
# the surface from the soil, so daytime heating stays at the surface instead of
# being conducted away.
#
# ACCEPTANCE TEST, and it is not the usual one. Because LPJ-GUESS is fed
# ST1L-ST4L_LPJ (soil temperature layers 1-4) alongside T2M_LPJG, a lever that
# warms the air while cooling the ground would hand the coupled vegetation model an
# incoherent state. So check skt and stl1 alongside T2m. UNLIKE the other levers,
# here a MODEST soil cooling is EXPECTED and physically correct -- that is what an
# insulating moss layer does, and it is why moss protects permafrost. The failure
# mode to watch for is a LARGE stl1/stl4 cooling with little T2m gain, which would
# mean we have merely insulated the soil without warming anything.
#
# GUARDRAILS: tropics net TOA (types 4/9 are nearly absent there, so it should not
# move); DJF Siberian T2m; global T2m RMSE.
#
# ---------------------------------------------------------------------------
# G1 -- F4 (boreal stomatal resistance) + D2b (ocean INP, gated below 700 hPa)
#
# THE FIRST PAIRING WHERE THE TWO TARGETS DO NOT FIGHT.
#
#   F4  RVRSMIN(3,4) 250 -> 1000   SOURCE  -- boreal: +0.749 K, t=6.06, best of campaign
#   D2b RCL_INPSEA 0.2, RCL_INPPMIN 70000  -- Southern Ocean: SW RMSE 6.88 -> 4.96
#
# Measured individually at 44 yr (threshold +-0.242 K boreal, +-0.019 SO SW RMSE):
#                Siberia dT2m        SO SW RMSE d      tropics      global TOA
#   D2b          -0.222 (marginal)   -0.17 signif       +0.09        -0.28
#   F4           +0.749 (signif)     -0.02 (barely)     +0.07        +0.10
#   naive sum    +0.53               -0.19              +0.16        -0.18
#
# WHY THEY SHOULD NOT CONFLICT. Every previous conflict in this campaign ran through
# mixed-phase overlap, which brightens SO cloud AND boreal mid-level cloud at once -- A1a
# bought 82% of the SO gap at the price of -0.75 K in Siberia. These two are disjoint in
# BOTH process and geography: stomatal conductance on vegetation types 3/4 (land, boreal
# only) versus ice nucleation over ocean below 700 hPa. Types 5/6/18 keep their defaults so
# the tropics are untouched by construction, and F4's SO effect (-0.02) is barely past the
# detection threshold -- it does not help the Southern Ocean, it simply does not harm it.
#
# THIS IS A PREDICTION, NOT A MEASUREMENT. AB (A1b+B2) predicted +0.21 K boreal and measured
# -0.053; ABB8's parts summed to +0.76 and measured -0.167; F5 showed near-TOTAL saturation
# where only strong sub-additivity was expected. Superposition in this model has been wrong
# in SIGN twice. The disjoint mechanisms are the best prior we have had, which is an argument
# for running it, not for believing it.
#
# WHAT TO CHECK: (i) does D2b's -0.222 K boreal cooling -- MARGINAL, t=-1.80, possibly noise
# -- actually eat 30% of F4's gain, or is the combination closer to the full +0.749?
# (ii) does F4 still leave the SO alone once D2b has changed it? (iii) tropics must stay near
# 42.6; any drift toward B5's 40.67 kills the package.
#
# WHAT IT STILL WILL NOT FIX: global net TOA stays ~+0.6 against a ~0 target, the SO cloud
# AREA deficit (83% vs CERES 89.7%) is untouched by everything tried so far, and the tropics
# remain ~2.4 W/m2 too low.
#
# FORCING: historical, as for every other lever run, so deltas stay comparable.
general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915 = 44 yr
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    # NOTE: the old hand-written NAMECECMIP6 block was REMOVED 2026-07-30.
    # 48r1 renamed that namelist to NAMECECMIP, so the block was never read:
    # LCMIP6/CMIP6DATADIR/NCMIPFIXYR/SSPNAME set there had NO effect and the
    # runs silently used NCMIPFIXYR=-1 (transient). Forcing is configured by
    # configs/components/oifs/oifs48.cmip.yaml via oifs.mip + oifs.scenario.
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    # CMIP6 forcing block: the pure-cmip7 path makes OIFS expect aerosol init
    # fields 117-120 that the awi3 INIT lacks -> ABOR1 GRID_IN MISSING FIELD.
    # NCMIPFIXYR=1850 pins GHG/ozone/aerosol to pre-industrial.
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_INPPMIN: 70000.0     # D2b: only below ~700 hPa, sparing tropical anvils
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare. Adding the tune entries to NAMECECFG kills the arpifs
            # read at su0yoma.F90:152. Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # F4, formerly a source edit to susveg_mod.F90:272-273.
                # 3 = Evergreen Needleleaf Trees, 4 = Deciduous Needleleaf Trees.
                # Types 5/6/18 deliberately keep their defaults so the tropics and
                # the broadleaf forests are untouched by construction.
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # Round 17: moss/litter insulating layer, as a skin-conductivity proxy.
                # Applied ONLY to types 4 (larch) and 9 (tundra) -- the two most
                # boreal-confined types (62 % and 70 % of their global area is >50N).
                # BOTH branches: RVLAMSK is skin-colder-than-substrate, RVLAMSKS is
                # skin-warmer, and the warm branch is the one JJA daytime takes.
                "ECE_TUNE_RVLAMSK(4)": 2.9
                "ECE_TUNE_RVLAMSK(9)": 2.9
                "ECE_TUNE_RVLAMSKS(4)": 2.9
                "ECE_TUNE_RVLAMSKS(9)": 2.9

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # NOTE: no add_config_sources -> default file_def.xml.j2 + field_def.xml,
    # i.e. the full evaluation output including TOA radiation and pressure
    # levels. Do NOT re-add the file_def_lpjg_spinup/field_def_lpjg_safe pair
    # here; that pair is for generating LPJ-GUESS offline forcing only.
