# N1 / N2 -- DAILY snow and soil diagnostic, 10 years. Round 19.
# NOT tuning candidates. These exist to test two inferences that monthly data cannot
# settle, and that I have already had to retract once each today.
#
# INFERENCE 1: the winter soil collapse is SEEDED IN AUTUMN.
# Reconstructing ZCVS offline from each run's own snowpack (it is not an output field;
# it equals FRTI(5)+FRTI(7), neither of which is written either):
#     month      Sep     Oct     Nov     Dec     Jan
#     dZCVS   +0.026  -0.075  -0.008  -0.001  -0.000
#     dsoil     +0.0    -4.2   -16.2   -22.2   -23.8   [K]
# The cover difference PEAKS in October exactly as the soil starts to diverge, then
# vanishes while the soil runs to -24 K. Reading: ~7 % more bare ground in October,
# before the insulating pack closes, cools the soil while it still can be cooled;
# from November the pack seals and the anomaly is locked in. Nothing in midwinter
# needs to differ -- and nothing does (Jan dZCVS = -0.0004).
# NOT YET DEMONSTRATED: that the November amplification (-4 -> -16 K) actually follows
# from the October seed. That is the whole basis of the proposed fix, and it rests on
# monthly means.
#
# INFERENCE 2: a melt-state gate would fire when the spring depletion is needed.
# Monthly-mean tsn is 271.0 K in May and only reaches 273.0 in June, yet melt-out is
# late May. If the pack is ripe only intermittently in May, a ripeness gate fires LATE,
# the spring depletion is lost, and the scheme becomes all winter cost and no summer
# benefit. Sub-daily melt events are exactly what monthly means destroy.
#
# WHY NOT JUST BUILD THE HYSTERESIS. Two reasons, both found by trying to falsify it:
#  (a) A ripe/not-ripe STATE TEST IS NOT HYSTERESIS. It is reversible: cover would flip
#      back to the linear formula every night and every cold snap, giving a spurious
#      diurnal oscillation in snow-covered fraction. Real melt-out is irreversible
#      within a season. The correct formulation (Swenson & Lawrence 2012) carries a
#      prognostic seasonal SWE_max and depletes against it, which cannot walk backwards
#      -- but that is a new surface prognostic, a much larger change.
#  (b) Density alone cannot substitute for melt state. October snow is rho~170 and May
#      rho~315, but May depth is still 0.29 m, so any exponent that saturates cover in
#      October also saturates it in May. The two regimes are genuinely inseparable by
#      density at their respective depths -- which is exactly why the present scheme has
#      to buy spring depletion at the cost of autumn.
#
# THE PAIR. N1 = K1 (adopted, scheme OFF). N2 = N1 + ECE_SNOW_SCF=1. Identical
# otherwise, so N2 minus N1 isolates the scheme at DAILY resolution through the
# autumn onset and the spring melt.
#
# WHAT TO LOOK FOR:
#   * Sep-Nov: does stl1 diverge on the days the cover differs, or does it keep falling
#     after the cover difference closes? The latter confirms seeding plus memory; the
#     former means something else drives November and the fix would not work.
#   * Apr-Jun: what fraction of days has tsn >= 273.15 (ripe)? If that is small in May,
#     inference 2 fails and a ripeness gate is the wrong criterion.
#
# FULL CAMPAIGN LENGTH, 1870-1916 (evaluate 1872-1915 = 44 yr). An earlier 10-yr version
# was cancelled: at 10 yr these cannot be scored against the campaign detection thresholds
# (Siberian JJA +-0.244 K etc., all calibrated at 44 yr), so they would not have been
# comparable with the other 43 runs -- which defeats the point of asking whether O1 is a
# viable lever rather than merely a process illustration. Daily output costs ~31 GB per
# run at this length, which is not a reason to break comparability.
general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915 = 44 yr, campaign standard
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_INPPMIN: 70000.0     # D2b: only below ~700 hPa, sparing tropical anvils
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare. Adding the tune entries to NAMECECFG kills the arpifs
            # read at su0yoma.F90:152. Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                # Components are (1) UV/VIS direct, (2) UV/VIS diffuse,
                # (3) NIR direct, (4) NIR diffuse. Forests (3,4,5,6,18,19) and
                # tundra (9) are deliberately untouched -- see header.
                # Crops, x0.8868 of as-released 0.0265/0.0341/0.2848/0.3210
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                # Irrigated Crops, x0.9099 of 0.0250/0.0296/0.2572/0.2790
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                # Semidesert, x0.9063 of 0.0529/0.0865/0.2045/0.2900
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # N2 ONLY: the snow-cover depletion under test.
                ECE_SNOW_SCF: 1
                ECE_SNOW_SCF_Z0: 0.016

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Per-run override so the shared template is untouched: adds daily
    # sd/rsn/tsn/asn/stl1/stl2 to the remapped daily stream.
    add_config_sources:
        file_def: ${xml_dir}/file_def_snowdiag.xml.j2
    # NOTE: no add_config_sources -> default file_def.xml.j2 + field_def.xml,
    # i.e. the full evaluation output including TOA radiation and pressure
    # levels. Do NOT re-add the file_def_lpjg_spinup/field_def_lpjg_safe pair
    # here; that pair is for generating LPJ-GUESS offline forcing only.
