# ---------------------------------------------------------------------------------
# SC3 --- supercooled liquid at cloud top: RDEPLIQREFRATE 0.2 with RDEPLIQREFDEPTH 1500 m
#
# THE TARGET.  The largest radiative bias left in the model is Antarctic summer cloud:
# at 90-60S in DJF the SW CRE is +6.98 W/m2 weaker than CERES, and the decomposition says
# it is OPACITY, not amount -- cloud cover is right to 2.2 pp but each cloud is 8 % too
# dim (CRE per unit cover -81.3 against CERES -88.2).  That excess shortwave is what melts
# the summer sea ice, and what is stored at ~100 m and re-emerges in autumn to block the
# refreeze.  The two Southern Ocean bands together contribute +0.74 W/m2 to the global
# TOA imbalance, the two largest positive terms in the budget.
#
# WHY A MIXED-PHASE LEVER AND NOT A POLAR ONE.  The hemispheres need OPPOSITE corrections:
# Antarctic summer SW CRE is +6.98 (too little reflection) while ARCTIC summer is -21.25
# (far too much).  Anything that brightens polar cloud globally would fix 7 W/m2 in the
# south and add to a 21 W/m2 error in the north.  But Antarctic summer cloud sits at
# -6.5 C and Arctic summer cloud at +3.9 C: the first is mixed-phase, where the liquid/ice
# partition sets opacity, the second is warm liquid, where ice microphysics has nothing to
# act on.  A lever confined to mixed-phase physics is therefore SELF-SELECTING -- a regime
# discriminator, with no latitude anywhere in it.
#
# THE LEVER.  In cloudsc the deposition rate that grows ice at the expense of liquid is
# throttled near cloud top by
#     factor = MIN(ZINFACTOR + (1-ZINFACTOR)*(RDEPLIQREFRATE + ZCLDTOPDIST/RDEPLIQREFDEPTH), 1)
# RDEPLIQREFRATE (0.5) sets the strength of that throttle AT cloud top, which is where the
# liquid that matters for albedo sits.  RDEPLIQREFDEPTH (500 m) sets how far down it
# reaches.  Lowering the rate retains more supercooled liquid and brightens the cloud, and
# it acts only where ice and supercooled liquid coexist.
#
# WHY THIS IS NOT A REPEAT OF A1c.  A1c changed only the DEPTH, 500 -> 1500 m, and was
# recorded as "failed -- no SO leverage; cloud-depth selectivity idea dead".  Re-scored on
# 2026-08-23 against the band it actually acts on, it did not fail:
#     SW CRE 90-60S DJF  -0.815*  (thr 0.346)     Arctic 60-90N JJA  +0.017 (thr 0.593)
#     Siberia JJA T2m    +0.110   (ns)            global net TOA     +0.006 (thr 0.073)
# Significant in the target band, EXACTLY ZERO in the Arctic, and free.  It was judged on
# the 45-65S metric, where the number is small because that band was already near right.
# The RATE has never been changed in this campaign.  Prior art on the awicm3 line
# (TUNE39PI_CLD4, TUNE40PI_CLD5) runs RDEPLIQREFRATE at 0.2.
#
# CONTROL: SB0, already complete, SAME BINARY, LX4 stack with no &NAMVDFS.  SC3 minus SC2
# isolates the depth increment on the current base, which is the A1c question asked
# properly -- A1c ran on the old pi_base and a pre-rebuild library.
#
# WHAT WOULD DISQUALIFY IT.  Arctic 60-90N JJA moving at all: it is already -21.25 W/m2
# overcorrected and this lever must not touch it.  45-65S going further negative: it is
# already -2.97 in DJF.  Siberian JJA or global net TOA beyond their thresholds.  And the
# tropics, since mixed-phase cloud exists there too at altitude.
#
# READ AT: 44 yr gives ~0.35 W/m2 on the polar DJF band; A1c produced 0.815 from the
# weaker knob alone, so this should be well resolved.  Leg 2 is enough for a first look.
# ---------------------------------------------------------------------------------

general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    icmcl_dir: "/work/ab0246/a270092/input/oifs-48r1/climate.v020/95_4_dms_rev3/"
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMECECFG:
                ECE_CLIMR_DMS: .true.
                ECE_DMS_CCN_SENS: 0.0    # X4: DMS field READ but the CCN lever OFF
            NAMCLDP:
                # SC3: supercooled liquid at cloud top.  See the header.
                RDEPLIQREFRATE: 0.2
                RDEPLIQREFDEPTH: 1500.0
                RVICE: 0.16
                RSNOWLIN2: 0.04              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_INPPMIN: 50000.0     # D2b: only below ~700 hPa, sparing tropical anvils
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare.  Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # --- P3: the fitted depletion, taken literally at course scale ---
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014     # field / low veg, d_c at rho=200
                ECE_SNOW_SCF_DCH: 0.026     # forest / high veg
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                ECE_SNOW_SCF_SWEMIN: 15.0

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Per-run override so the shared template is untouched: adds daily
    # sd/rsn/tsn/asn/stl1/stl2.  Retained from N/O because f_full -- the fraction
    # of the box at cover >= 0.999 -- is the diagnostic that exposed the defect and
    # is the one that has to come back.
    add_config_sources:
        file_def: ${xml_dir}/file_def_snowdiag.xml.j2
