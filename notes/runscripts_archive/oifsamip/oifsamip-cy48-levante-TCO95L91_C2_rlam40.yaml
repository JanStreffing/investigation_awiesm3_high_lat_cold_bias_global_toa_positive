# Round 10 -- C2: NAMVDF RLAM 150 -> 40 m, on the B8 binary (RVLAMSK/S(3,4)=5)
#
#   RLAM is the asymptotic mixing length used ONLY in the statically-unstable
#   branch of vdfexcu (vdfexcu.F90:397, ZKLENT=PLAM) -- the daytime convective
#   land boundary layer, and nothing else. suvdf.F90:77 sets the 150 m default,
#   :108-109 then reads NAMVDF over it, so this is namelist-only, no rebuild.
#
#   ECMWF's own published diagnosis of the IFS summer land cold bias is
#   *excessive turbulent mixing in cloudy boundary layers* -- they state cloud
#   microphysics is NOT the main driver. Less mixing -> shallower BL -> surface
#   sensible heating retained in a thinner layer -> warmer T2m, and less moisture
#   lofted -> less boreal cloud. Both signs favour us.
#
#   REFERENCE FOR THIS RUN IS amip_B8_lamsk5 (+0.502 K Siberia JJA), not the
#   control: the current install/lib has B8 compiled in.
general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "02:00:00"
    initial_date: "1870-01-01"
    final_date: "1876-01-01"
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 6
    use_venv: false
computer:
    taskset: true
oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"
oifs:
    # NOTE: the old hand-written NAMECECMIP6 block was REMOVED 2026-07-30.
    # 48r1 renamed that namelist to NAMECECMIP, so the block was never read:
    # LCMIP6/CMIP6DATADIR/NCMIPFIXYR/SSPNAME set there had NO effect and the
    # runs silently used NCMIPFIXYR=-1 (transient). Forcing is configured by
    # configs/components/oifs/oifs48.cmip.yaml via oifs.mip + oifs.scenario.
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16
            NAMVDF:
                RLAM: 40.0
oasis3mct:
