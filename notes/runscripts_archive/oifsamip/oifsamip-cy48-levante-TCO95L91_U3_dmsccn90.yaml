# U3 -- MARINE BIOGENIC CCN at the MIDPOINT of the published range, S = 90.
#
# The third point of the bracket.  With T3 (S=0), U2 (43), U3 (90) and U1 (166) the
# SO and tropical responses can be FITTED against S and the guardrail-limited maximum
# read off the curve.  Its own pass/fail matters less than its position on that curve;
# it exists so the choice of operating point is interpolated rather than guessed.
#
# WHAT U1 ESTABLISHED (S = 166, top of Woodhouse et al. 2010's -43..+166 cm-3 per
# mg S m-2 d-1).  The lever is REAL and it is SEASONALLY SELECTIVE in the right way:
#
#            SO 65-45S      tropics 30S-30N
#   DJF        -7.25            -1.56          <- 4.6:1 in the season that matters
#   JJA        -0.63            -2.44
#   annual     -2.25            -2.14
#
# SO DJF -7.25 is 67 % of the +10.86 W/m2 DJF SO deficit, and it lands there because the
# bloom is there -- no hemispheric parameter was invented to produce it.  But the
# tropical cost is FLAT year-round, so the ANNUAL means come out level and -2.14 in the
# tropics is 4x the +-0.5 guardrail set in advance.  S = 166 is therefore not adoptable.
#
# WHY THE TROPICS RESPOND MORE PER UNIT dCCN.  Twomey scales with d ln(Nd), and tropical
# background CCN (~52 cm-3) is LOWER than the SO's (~78), so the same absolute increment
# is a larger fractional one.  That is physics, not a bug -- which is also why the fix is
# to lower S rather than to regionalise it.
#
# THE BRACKET.  The response is sub-linear in S (log), so 166 -> 43 will retain MORE than
# a quarter of the effect; how much more is measured here, not assumed.  U2 and U3 give a
# three-point curve (0, S, 166) from which the largest S that respects the tropical
# guardrail can be read off, instead of guessing a fourth value.
#
# CONTROL is T3: identical DMS-Rev3 input, identical winds, ECE_DMS_CCN_SENS = 0.
# Screening at 1 year is valid here: U1 moved SO SW CRE by 2.25 W/m2, above the ~2 W/m2
# floor where the one-year answer reproduces the 44-year one.  U2 may fall BELOW that
# floor, in which case its number bounds the effect rather than resolving it -- stated
# now so it is not over-read later.
#
# PASS/FAIL, stated in advance:
#   tropics within +-0.5 AND |SO DJF| > 2  -> adoptable; promote to 44 yr
#   tropics within +-0.5 AND |SO DJF| < 2  -> real but too small to matter; retire
#   tropics beyond +-0.5                   -> no value in the published range works

