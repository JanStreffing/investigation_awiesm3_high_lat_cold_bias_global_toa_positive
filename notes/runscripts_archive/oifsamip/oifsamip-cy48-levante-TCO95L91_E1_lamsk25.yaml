# Round 10 -- E1: RVLAMSK/RVLAMSKS(3,4) 5 -> 2.5 (SOURCE, susveg_mod.F90:176-177,201-202)
#
#   B8 halved skin-layer conductivity for needleleaf trees (10->5) and gave the
#   single best boreal response of the whole campaign: Siberia JJA T2m +0.502 K,
#   cloud -1.98 pp, surface SW +6.38 W/m2. That a *surface* parameter moved cloud
#   that much is the evidence that boreal cloud here is moisture-supply-limited,
#   not microphysics-limited -- which is also why A2 did nothing.
#
#   E1 halves it again. The question is linearity: if +0.5 K -> ~+1.0 K the lever
#   still has room and we push further; if it saturates, the remaining bias needs
#   a different axis and we stop spending runs here.
#
#   Built on libsurf.SP.so md5 4b1f678bc051 (B8 was e41a8d4acdb3), verified changed
#   after esm_master recomp-oifsamip-cy48/oifs-48r1.
