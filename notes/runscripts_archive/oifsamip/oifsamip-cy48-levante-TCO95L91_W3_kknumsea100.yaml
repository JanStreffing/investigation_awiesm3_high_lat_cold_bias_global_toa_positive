# AMIP TCO95L91 -- W3: RCL_KK_CLOUD_NUM_SEA 50 -> 100 cm-3.  NEVER RUN BEFORE.
# =============================================================================
# THE ONLY UNTRIED LEVER AIMED AT CLOUD AMOUNT.  Round 22 split the Southern Ocean error
# AMOUNT +4.87 W/m2 (65.5 %) / OPACITY +2.57 (34.5 %), and round 23 measured that the INP
# branch reaches the opacity third only.  Round 30 confirmed it at the margin: N2
# (RCL_INPSEA 0.05) buys +0.448 pp of a 6.4 pp area deficit for -3.808 of CRE, i.e.
# 0.118 pp per W/m2 -- closing the amount deficit at that rate would need ~54 W/m2.
#
# Droplet number acts on AMOUNT rather than opacity, through lifetime: the KK
# autoconversion rate goes as ZCONST**RCL_KKBAUN with a NEGATIVE exponent
# (cloudsc.F90:2258), so more droplets means slower rain-out, longer-lived cloud and more
# cloud area, on top of the Twomey brightening.
#
# SELECTIVE BY CONSTRUCTION, like RCL_INPSEA: cloudsc.F90:2118-2140 branches on
# PLSM > 0.5 and takes RCL_KK_CLOUD_NUM_LAND = 300 over land, so Siberia cannot respond.
# Live path verified: IWARMRAIN = 3 is hardcoded at cloudsc.F90:754 and NCLOUDACT = 0
# (suecrad.F90:553), so the constant is used rather than prognostic CCN.  It is also a
# DIFFERENT pathway from DMS, which feeds PCCNO in radpar.F90 -- the radiation's effective
# radius -- not PCCN in the microphysics.
#
# WHY 100.  A doubling of the sea value, staying INSIDE the model's own land/sea range
# (sea 50, land 300) rather than outside it, and symmetric with the campaign's own A2,
# which halved the land value 300 -> 150.  Not invented: it is a bracket of an existing
# parameter, and the point of this arm is the SIGN and SIZE of the area response, not a
# tuned value.
#
# HAD TO BE EXPOSED FIRST.  RCL_KK_CLOUD_NUM_SEA/_LAND were bound only by the ASSOCIATE
# block in sucldp.F90, unreachable from a namelist -- the same trap RCLCRIT_SEA was in.
# Moved onto the POINTER mechanism (oifs fb04b2d), defaults still assigned afterwards so a
# silent namelist reproduces bit-for-bit.  VERIFY THE STAGED work/lib/oifs/libarpifs.SP.so
# CARRIES IT before reading this run -- W1 was lost to exactly that.
#
# SCORE ON CLOUD AREA, NOT CRE.  Round 23's instruction.  If this one also buys opacity,
# the amount third has no lever in the current parameter set and that should be stated.
# =============================================================================
# W1 = S4 with RCLCRIT_SEA raised.  ONE namelist number, against a control already run
# at 46 years.
#
# THIS IS S3, WHICH WAS CANCELLED AND NEVER RUN.  Round 23 designed it, made the source
# change to expose RCLCRIT_SEA in NAMCLDP -- that change is still in the tree, which is
# why this needs no rebuild -- and then cancelled it, together with S1, "for the tropics,
# not for the Southern Ocean".  The cancellation was an INFERENCE, by analogy with B3:
# RCLDIFF moved the other way warms the tropics, so a lever that adds low cloud should
# cool them.
#
# WHY THAT INFERENCE DESERVES A MEASUREMENT.  RCLDIFF is a GLOBAL cloud-erosion term.
# RCLCRIT_SEA is the autoconversion threshold for STRATIFORM WARM RAIN over sea only
# (cloudsc.F90:2056-2069, branched on PLSM > 0.5).  Southern Ocean low cloud is exactly
# that regime; tropical precipitation is largely convective and handled by a different
# scheme.  So the tropical response to this knob may be much weaker than the RCLDIFF
# analogy implies -- or it may not be, and then the family is closed honestly instead of
# by assumption.  Either answer is worth 46 years.
#
# WHAT IT IS SUPPOSED TO BUY, and why this family and not the INP one.  Round 22 split the
# Southern Ocean error: AMOUNT +4.87 W/m2 (65.5 %), OPACITY +2.57 (34.5 %), with a cloud
# area deficit of 6.43 pp (model 83.06 % against CERES 89.49 %).  Round 23 then measured
# that the INP branch buys OPACITY only -- D2a +0.63 pp and D2b +0.43 pp of that 6.43,
# inside the noise floor -- and A1a/A1b confirmed it independently at 93 % opacity.  So
# two thirds of the Southern Ocean error has never had a lever.  Raising RCLCRIT_SEA makes
# cloud water build further before it rains out, so cloud holds more water AND survives
# longer: opacity and AREA.
#
# Independently corroborated 2026-08-19 from cloud phase: the model's low-level Southern
# Ocean liquid fraction is 0.875 against CALIPSO-GOCCP's 0.858, i.e. already slightly MORE
# liquid than observed.  The phase is not the problem, so the remaining error cannot be
# fixed by any further mixed-phase or INP lever.
#
# SCORE ON CLOUD AREA, NOT CRE.  Round 23's explicit instruction, because CRE conflates
# the amount and opacity thirds and the INP branch already looked good on CRE while doing
# nothing for area.
#
# WHY 6.0E-4.  Round 23's value, kept so this is the run that was designed rather than a
# new one: slightly above RCLCRIT_LAND (5.5E-4), removing the land/sea contrast and a
# little more.
#
# WHAT WOULD DISQUALIFY IT.  Tropical SW CRE or tropical net moving beyond the +-0.5
# tolerance that bound DMS.  Siberia cannot respond -- PLSM > 0.5 selects RCLCRIT_LAND
# there -- so unlike the overlap arms this one cannot cost the boreal forest, and that is
# the whole reason it is worth running.  Reference hygiene, round 23: score area against
# CERES and MODIS, NOT against ERA5, which is not an independent cloud reference for this
# model (ERA5 81.6 % against the model's 83.1 %, while CERES and MODIS say 89.5 and 89.3).

general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915 = 44 yr, campaign standard
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_KK_CLOUD_NUM_SEA: 100.0   # W3: the ONLY change from S4 (sea 50 -> 100 cm-3)
                RCL_INPPMIN: 50000.0     # S4: gate ceiling to ~500 hPa, covering the observed 656 hPa cloud
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare.  Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # --- P3: the fitted depletion, taken literally at course scale ---
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014     # field / low veg, d_c at rho=200
                ECE_SNOW_SCF_DCH: 0.026     # forest / high veg
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                ECE_SNOW_SCF_SWEMIN: 15.0

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Per-run override so the shared template is untouched: adds daily
    # sd/rsn/tsn/asn/stl1/stl2.  Retained from N/O because f_full -- the fraction
    # of the box at cover >= 0.999 -- is the diagnostic that exposed the defect and
    # is the one that has to come back.
    add_config_sources:
        file_def: ${xml_dir}/file_def_snowdiag.xml.j2
