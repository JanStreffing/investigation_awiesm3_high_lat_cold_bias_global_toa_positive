# ---------------------------------------------------------------------------------
# LF2 --- 10-year clean OIFS-AMIP run (no LPJ-GUESS) whose ONLY purpose is to write the
# daily surface fields that drive the offline LPJ-GUESS re-spin for the corrected CORE3.
# See HANDOFF_lpjg_respin_core3.md in the campaign repo.
#
# PHYSICS = the adopted stack, and nothing newer.  Base is SB2 (LX4 + RSBLB 2.0), which is
# what the coupled 11-series carries and what gave the best campaign CMPI (11V, 0.7385).
# Do NOT base this on SC2/SC3: RDEPLIQREFRATE 0.2 is in the discarded table (SC3 breaks
# the Arctic, -1.85 on a band already -18 over-reflective).  A rejected lever carried into
# the forcing is inherited by every spin-up built on it.
#
# S4 REMOVED.  RCL_INPPMIN is 70000, the as-released default, not the 50000 that every
# existing AMIP runscript still carries.  The S4 review finished 2026-08-24: coupled,
# removing it improves Siberian JJA by +0.590 K resolved, recovers the sub-Antarctic
# overcorrection (+3.18/+3.45 W/m2 at both forcings), leaves the polar band untouched, and
# gives the best campaign CMPI.  11W/11V/11X all run 70000.
#
# Also carried from the coupled 11-series, because the forcing should be the atmosphere
# LPJ-GUESS will actually meet: GGAUSSB -0.5 and ENTSTPC3 1 (retained from 09C).  LRDALB
# and the melt-pond settings are coupled-only (LPJG albedo, FESOM) and do not apply here.
#
# FORCING.  Observed AMIP SST 1870-1879 (earliest available, pre-Krakatoa), GHG/aerosol/
# ozone FIXED at 1850 via NAMECECMIP NCMIPFIXYR, verified to reach fort.4 in Z1.  This is
# the PI-representative decade the spin-up needs; the coupled runs are piControl.
#
# OUTPUT.  file_def_lpjg_spinup + field_def_lpjg_safe.xml.j2 write the daily tas/tasmin/
# tasmax/rsns/rlns/sfcWind/pr/tdps/ps/psl/clt/prsn/evspsbl/prw/sd/rsn.  The .j2 template
# divides accumulated fluxes by oifs.flux_accumulation_period (= time_step, 3600), so the
# fluxes come out in W/m2 directly.  The retired static field_def_lpjg_safe.xml divided by
# 21600 and produced fluxes 6x too low (the reason the first re-spin starved).  Verify on
# the first output file: annual-mean rsns over land must be O(100) W/m2, not O(20).
#
# VERIFY BEFORE TRUSTING.  &NAMVDFS is new.  Confirm RSBLB = 2 in <run>/work/fort.4 and
# that the staged lib/oifs/libarpifs.SP.so is the one carrying suvdfs.F90 (the AMIP tree
# model_codes/oifsamip-cy48 has it: ifs-source/arpifs/phys_ec/suvdfs.F90, vdfexcu.F90).
# An ABSENT group silently keeps 5.0.
#
# Post-process with scripts/sbatch/make_lpjg_forcing.sbatch (create_lpjg_forcing.py) on
# outdata/oifs/atm_1d_18??-18??.nc -> input/lpj-guess/oifs_forcing/
#   AMIP_LF2_1d_1870-1879_TCO95_PI_sb2nos4.nc
# ---------------------------------------------------------------------------------

general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "03:00:00"   # single job for the decade: ~11 min/yr measured + margin
    initial_date: "1870-01-01"
    final_date: "1880-01-01"   # 10-yr clean ~PI forcing decade
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    icmcl_dir: "/work/ab0246/a270092/input/oifs-48r1/climate.v020/95_4_dms_rev3/"
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMECECMIP:
                NCMIPFIXYR: 1850         # PI forcing, as in Z1 (verified in fort.4)
            NAMECECFG:
                ECE_CLIMR_DMS: .true.
                ECE_DMS_CCN_SENS: 0.0    # DMS field READ, the CCN lever OFF
            NAMCLDP:
                RVICE: 0.16
                RSNOWLIN2: 0.04          # LX4
                RCL_INPSEA: 0.2          # D2b
                RCL_INPPMIN: 70000.0     # S4 REMOVED (2026-08-24); release default
            NAMVDFS:
                RSBLB: 2.0               # SB2: stable-BL mixing
            NAMGWWMS:
                GGAUSSB: -0.5            # as the coupled 11-series
            NAMCUMF:
                ENTSTPC3: 1              # as the coupled 11-series (retained from 09C)
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # --- P3: the fitted depletion, taken literally at course scale ---
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014     # field / low veg, d_c at rho=200
                ECE_SNOW_SCF_DCH: 0.026     # forest / high veg
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                ECE_SNOW_SCF_SWEMIN: 15.0

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Emit the daily LPJG-driving surface fields instead of the default OIFS output.
    # context_ifs.xml includes ./file_def.xml and ./field_def.xml by fixed name, so we
    # override those two config *sources*.  Both are .j2 so the flux divisor is templated.
    add_config_sources:
        file_def:  "${xios.xml_dir}/file_def_lpjg_spinup.xml.j2"
        field_def: "${xios.xml_dir}/field_def_lpjg_safe.xml.j2"
