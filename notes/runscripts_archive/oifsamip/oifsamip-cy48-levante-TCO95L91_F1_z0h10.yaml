# F1 -- boreal needleleaf z0h = z0m/10  (SOURCE: susveg_mod.F90:361-362)
#
# As released, ALL closed-forest types (3,4,5,6,18) set z0h = z0m, i.e. kB^-1 = 0, while
# every other land type uses z0m/100. Observations give kB^-1 = ln(z0m/z0h) ~ 2 for forests
# (z0h ~ z0m/7), so forest heat and moisture exchange is parameterised as far more efficient
# than observed. Raising the resistance forces the surface to warm to shed the same energy,
# and cuts evaporation -- both raise Bowen.
#
# STRONGEST of the four a priori: it is the largest departure from observation, and unlike
# LAI/COV it does not require making the vegetation less realistic to fix a temperature bias.
#
# HONEST CAVEAT ON SIGN: for SKIN temperature the sign is unambiguous (warmer). For 2 m
# temperature it is not -- reducing z0h steepens the near-surface gradient and T2m is
# diagnosed within it, so part of the skin warming may not reach 2 m. The moisture side
# (less evaporation) reinforces warming. Net warming is the PREDICTION, not a certainty.
#
# ALL FOUR F-RUNS SHARE ONE OBSERVATIONAL ANCHOR: the measured Siberian JJA Bowen ratio is
# 0.43, against ~0.5-1.5 observed for boreal conifer. The model puts too much of the surface
# energy into latent heat. Every F lever raises Bowen, and all are indexed on vegetation
# types 3 and 4 (evergreen/deciduous needleleaf), so they are boreal-selective by
# construction -- types 5/6/18 (broadleaf, mixed) keep their defaults, leaving the tropics
# and temperate forests alone. That is the property B5 lacked: its +0.407 K came with
# -1.94 W/m2 in the tropics, which are already 2.5 below CERES.
#
# NONE of these has been tried before: RVZ0H, RVLAI and RVCOV have zero mentions in the
# campaign logbook, and RVRSMIN was tried only at 500 (expA, +0.232 K, marginal).
#
# FORCING: same as every other lever run (oifs.scenario defaults to "historical"), so deltas
# are directly comparable to B5's +0.407 K. 46 yr, evaluated 1872-1915, threshold +-0.240 K.
general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915 = 44 yr
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    # NOTE: the old hand-written NAMECECMIP6 block was REMOVED 2026-07-30.
    # 48r1 renamed that namelist to NAMECECMIP, so the block was never read:
    # LCMIP6/CMIP6DATADIR/NCMIPFIXYR/SSPNAME set there had NO effect and the
    # runs silently used NCMIPFIXYR=-1 (transient). Forcing is configured by
    # configs/components/oifs/oifs48.cmip.yaml via oifs.mip + oifs.scenario.
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    # CMIP6 forcing block: the pure-cmip7 path makes OIFS expect aerosol init
    # fields 117-120 that the awi3 INIT lacks -> ABOR1 GRID_IN MISSING FIELD.
    # NCMIPFIXYR=1850 pins GHG/ozone/aerosol to pre-industrial.
    add_namelist_changes:
        fort.4:
            NAMCLDP:
                RVICE: 0.16          # match the coupled tuning runs explicitly

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # NOTE: no add_config_sources -> default file_def.xml.j2 + field_def.xml,
    # i.e. the full evaluation output including TOA radiation and pressure
    # levels. Do NOT re-add the file_def_lpjg_spinup/field_def_lpjg_safe pair
    # here; that pair is for generating LPJ-GUESS offline forcing only.
