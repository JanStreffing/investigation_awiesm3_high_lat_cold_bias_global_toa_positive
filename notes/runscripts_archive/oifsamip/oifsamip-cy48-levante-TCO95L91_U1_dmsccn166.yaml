# U1 -- MARINE BIOGENIC CCN, ON.  ECE_DMS_CCN_SENS = 166.
#
# THIS IS A KILL TEST, and it is deliberately run at the MOST OPTIMISTIC published
# value first.  Woodhouse et al. (2010, ACP 10, 7545) measure dCCN/dFlux_DMS at
# -43 to +166 cm-3 per (mg S m-2 d-1), varying with season and hemisphere.  That range
# is far too wide to pick a number from honestly, so the coefficient is a namelist knob
# and the range gets BRACKETED.  If +166 -- the top of the published range -- does not
# move Southern Ocean SW CRE beyond the measured 1-year detection threshold of
# +-1.97 W/m2, then the whole marine-biogenic-CCN line is dead and it cost 11 minutes.
#
# WHY THE EFFECT MIGHT STILL BE REAL despite Woodhouse's low sensitivity.  Their number
# is a PERTURBATION sensitivity around a state that already contains DMS.  This model
# contains none: Genthon (1992) is sea salt from wind and MACv2-SP is anthropogenic
# plumes only.  Round 24 measured the consequence -- SO droplet number is right in the
# MEAN (Nd ~ 73 cm-3 against an observed 60-120) but its SEASONAL PHASE IS INVERTED,
# lowest in DJF (68.5) and highest in JJA (76.1), where observations peak in DJF with
# the bloom and Cape Grim sees 2-3x summer/winter.  So this is a phase correction, not
# a small perturbation on an existing term.
#
# WHAT IS WIRED.  radpar.F90, immediately after SURFRAD fills PCCNO from Genthon:
#     Sc   Saltzman et al. (1993)
#     k    Nightingale et al. (2000), k600 = 0.222 u^2 + 0.333 u
#     F    = k * Cw                        [mol m-2 s-1]
#     PCCNO += ECE_DMS_CCN_SENS * F_S      [F_S in mg S m-2 d-1]
# PCCNO then flows to radiation_scheme, through the Martin et al. (1994) quadratic to
# droplet number and effective radius, i.e. the Twomey effect.  Ocean points only.
# The input is DMS-Rev3 (Hulswar et al. 2022) via ocp-tool, verified in T3.
#
# CONTROL is T3: identical Rev3 input, identical winds, ECE_DMS_CCN_SENS = 0.
#
# PASS/FAIL, stated in advance:
#   |d(SO SW CRE)| > 1.97 W/m2  -> the lever is real, bracket the low end next
#   |d(SO SW CRE)| < 1.97       -> DEAD at the top of the published range; stop here
# GUARDRAIL: the tropics are only -0.67 W/m2 from CERES period-clean, so a tropical
# response beyond ~0.5 W/m2 would make this a global knob in disguise regardless.

