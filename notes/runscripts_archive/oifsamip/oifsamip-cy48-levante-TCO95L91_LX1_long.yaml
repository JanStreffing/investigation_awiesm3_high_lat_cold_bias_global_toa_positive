# ---------------------------------------------------------------------------------
# PROMOTED TO FULL LENGTH 2026-08-10.  46 years, evaluate 1872-1915 = 44 yr, 8-yr legs.
#
# WHY NOW.  The one-year screens have taken this as far as they honestly can.  They
# resolve the radiative metrics and NOTHING else: the Siberian JJA threshold is +-0.242 K
# and DJF +-0.588 K, both 44-year numbers that a single year cannot approach.  Every
# configuration below changes cloud, and cloud is the boreal energy supply, so the
# Siberian cost is entirely unmeasured -- and RCL_OVERLAPLIQICE=0.1 was historically
# REJECTED for boreal damage, which is exactly what these runs must now price.
#
# CONTROL IS P5, which already has 44 years on disk.  Verified 2026-08-10 that T3 (the
# base these were built on) is BIT-FOR-BIT identical to P5 at year 1870 on SO SW CRE,
# tropical LW CRE and global net TOA -- the only namelist difference is
# ECE_CLIMR_DMS=.true., which reads the DMS field but has no radiative effect at
# ECE_DMS_CCN_SENS=0.  So no separate control run is needed.
#
# FORCING CAVEAT, deliberately NOT changed here.  These run with NCMIPFIXYR=-1, i.e.
# transient GHG/ozone/aerosol, exactly like every run in the archive -- so they stay
# comparable to P5 and to all 50 prior arms.  The absolute energy baseline is offset by
# an estimated ~0.15 W/m2 as a result; that is being handled separately by one
# fixed-forcing control run (Z1 tests the mechanism), NOT by changing this comparison.
# ---------------------------------------------------------------------------------
# LONG X1: RSNOWLIN2 0.04 alone on the adopted stack.  THE GATING RUN -- it is the
#   single new lever, +2.74 tropical LW CRE (124 % of the deficit), and every other
#   configuration here inherits it.  If it damages Siberia, they all do.
# X-SERIES -- everything the campaign has adopted, plus the two new levers, as a ladder.
#
# THE BASE IS T3, not the bare model: G4 (RVRSMIN 1000/1000/225), K1 (RVVEGALB types
# 1/10/11 + SOILALB x0.95), P3 fitted snow depletion at SWEMIN=15, D2b (RCL_INPSEA 0.2,
# RCL_INPPMIN 70000), RVICE 0.16, and the DMS-Rev3 ICMCL read with ECE_DMS_CCN_SENS=0.
# So each rung below is ONE change from the rung above, and T3 is the control for X1.
#
# WHY A LADDER AND NOT ONE COMBINED RUN.  W9 put all eight DARS2 parameters together and
# came out significantly NON-ADDITIVE: the SO longwave interaction was +2.415 W/m2, with
# the sum of the parts predicting -1.561 and the combination measuring +0.854.  A single
# combined run would tell us the total and nothing about which part produced it, and the
# parts cannot be inferred afterwards.  Three rungs cost 33 minutes.
#
# WHAT IS NEW HERE, and what each was measured to do ALONE at one year:
#   RSNOWLIN2 0.030 -> 0.04   (W8)  tropical LW CRE +2.581 against a +-0.279 threshold,
#       i.e. 120 % of the -2.16 deficit, the largest tropical LW response in the campaign
#       by a factor of five -- and with tropical net TOA (+0.671) and global net TOA
#       (+0.321) both BELOW their thresholds, so no resolved net energy cost.  It works
#       because it is the TEMPERATURE exponent of ice->snow autoconversion
#       (cloudsc.F90:2858), so it builds cold thin cirrus rather than thickening anvils,
#       and thin cirrus is longwave-dominant.  Side effect to watch: SO LW CRE +1.223,
#       above its +-0.584 threshold, which warms the Southern Ocean -- the wrong way.
#       Value 0.04 is the awiesm3 v3.4.2 TCO95L91-DARS2 setting, not invented.
#   ECE_DMS_CCN_SENS 166      (U1)  SO SW CRE -2.25 annual and -7.25 in DJF, 67 % of the
#       +10.86 DJF deficit -- but tropics -2.14, four times the +-0.5 tolerance, which is
#       why it was not adoptable ALONE.  W8 is the reason to retry it: it supplies
#       tropical headroom the lever previously had to find for itself.
#   RCL_INPPMIN 70000 -> 50000 (S4) SO SW CRE -1.98 against P5 with a tropical cost of
#       only -0.10 and global net TOA -0.41, but SO SW RMSE +0.255 against a +-0.019
#       threshold.  Best mean, worse pattern -- which is why it is the LAST rung and not
#       folded into the base.
#
# ONE YEAR LICENSES THE RADIATIVE METRICS ONLY.  Measured 1-yr pair thresholds:
# tropical LW +-0.279, tropical SW +-0.990, tropical net +-1.656, SO SW +-1.974,
# SO LW +-0.584, global net +-1.333.  Below threshold is a bound, not a result, and
# nothing here licenses a temperature claim.
#
# X1 = T3 + RSNOWLIN2 0.04.  Does W8 survive on the real base?  W8 was measured on the
# BARE model (defaults + RVICE 0.16); this base already carries D2b's ice-nuclei changes,
# which act on the same ice phase, so the two could easily not add.  Control: T3.

general:
    user: !ENV ${USER}
    setup_name: "oifsamip"
    version: "cy48"
    compute_time: "08:00:00"
    initial_date: "1870-01-01"
    final_date: "1916-01-01"   # 46 yr; evaluate 1872-1915
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-${general.version}/"
    account: "ab0246"
    nday: 0
    nmonth: 0
    nyear: 8
    use_venv: false

computer:
    taskset: true

oifsamip:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

oifs:
    icmcl_dir: "/work/ab0246/a270092/input/oifs-48r1/climate.v020/95_4_dms_rev3/"
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    lresume: false
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    add_namelist_changes:
        fort.4:
            NAMECECFG:
                ECE_CLIMR_DMS: .true.   # read the 8th ICMCL field (emdms, paramId 210043)
            NAMCLDP:
                RVICE: 0.16
                RSNOWLIN2: 0.04              # match the coupled tuning runs explicitly
                RCL_INPSEA: 0.2          # D2b: ocean INP -> 20% (marine biogenic floor)
                RCL_INPPMIN: 70000.0     # D2b: only below ~700 hPa, sparing tropical anvils
            # NAMSURFTUNE, not NAMECECFG: NAMECECFG is read twice from the same
            # fort.4 -- by ECE_CONFIG in arpifs/ecearth.F90 and by SURFECE_CONFIG
            # in surf/surfece.F90 -- and a Fortran namelist read dies with
            # "invalid reference to variable" on any name the reading module does
            # not declare.  Verified the hard way, 2026-08-02.
            NAMSURFTUNE:
                # --- G4 base ---
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                # --- K1: vegetation albedo, types 1 / 10 / 11 only ---
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
                # --- P3: the fitted depletion, taken literally at course scale ---
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014     # field / low veg, d_c at rho=200
                ECE_SNOW_SCF_DCH: 0.026     # forest / high veg
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                ECE_SNOW_SCF_SWEMIN: 15.0

oasis3mct:
    lresume: false   # generate the rst files for the first leg
    time_step: 86400

xios:
    with_model: oifs
    nproc: 4
    omp_num_threads: 32
    # Per-run override so the shared template is untouched: adds daily
    # sd/rsn/tsn/asn/stl1/stl2.  Retained from N/O because f_full -- the fraction
    # of the box at cover >= 0.999 -- is the diagnostic that exposed the defect and
    # is the one that has to come back.
    add_config_sources:
        file_def: ${xml_dir}/file_def_snowdiag.xml.j2
