# ---------------------------------------------------------------------------------
# 11X = 11W on the CORRECTED CORE3 mesh.  Same physics, new bathymetry/cavities.
#
# WHY.  The Southern Ocean biases this campaign has been chasing were traced on 2026-08-26
# to spurious open-ocean deep convection in the Weddell: Oct-Dec MLD2 of 758.6 m against
# 148.8 m in WOA18, a quarter of the 90-60S area convecting past 1000 m and the deepest node
# reaching 4160 m, on a surface 0.20 psu too salty.  That convection mines heat out of
# 700-2000 m, where the model is 0.358 K too cold against the PHC3 it was initialised from,
# delivers it to a surface already ~2 K too warm, melts the ice, drops the albedo and raises
# absorbed shortwave.  It is the mechanism behind the positive TOA and its drift.
#
# The shipped CORE3 mesh was then found to carry errors in CAVITY DEPTH, and was replaced.
# Ice-shelf cavity geometry sets where and how much meltwater enters the Weddell, which is
# precisely the freshwater term that maintains the halocline the convection destroys.  So
# the mesh error is a candidate cause of the whole chain, and has to be excluded before any
# mixing or restratification parameter is touched.
#
# LEG LENGTH.  nyear, restart_rate and restart_first must all be 10.  esm_tools sizes the
# leg from nyear but FESOM takes run_length from restart_rate, so nyear=1 against
# restart_rate=10 builds a one-year coupled window while telling FESOM to run ten years:
# FESOM then reaches the end of the window with no restart written, because its first one
# is not due until year 10, and the leg cannot be continued.  The core3y1 bring-up hit the
# same thing from the other side.  Keep the three in step.
#
# THE TEST.  One variable: the mesh.  Physics identical to 11W, which is the current best
# configuration (LX4 + RSBLB, S4 removed).  Everything in namelist.oce is untouched, and it
# was already verified identical between the 11-series and the new-mesh reference run.
#
# WHAT WOULD SETTLE IT.  Oct-Dec MLD2 at 90-60S falling from 758.6 m toward the WOA18 148.8,
# the >1000 m area fraction falling from 25 percent, and the 90-60S upper-50 m salinity bias
# falling from +0.181 psu.  If those move, the mesh was the cause and the mixing parameter
# search is unnecessary.  If they do not, the cause is elsewhere and K2-K6 are back on.
#
# MESH DISCIPLINE.  This arm is core3 (220509 nodes).  Every arm up to and including 11W is
# core3_beta (211567).  They cannot be compared without selecting the matching mesh file:
# see scripts/analysis/meshguard.py, which raises rather than letting numpy broadcast a
# 211567-node field against a 220509-node area array and return a plausible wrong number.
#
# WHAT CHANGED FROM 11W, and nothing else:
#   FESOM nproc stays 1792, as in 11W, so the decomposition is NOT a second variable.
#     The shipped core3 carried dist_256/512/1024 only, so dist_1792 was copied in from
#     core3_part_staging, whose nod2d/elem2d/aux3d/cavity_depth files are byte-identical
#     to the shipped ones and which has no .failed siblings, unlike core3_part_mine.
#   FESOM initial restart -> restart/core3_linfs at 1959.  linfs, matching which_ale, which
#     esm_tools sets to linfs for awiesm3.  The zstar restart alongside it must NOT be used:
#     a zstar restart read under linfs is silently misinterpreted.
#   restart/CORE3 no longer exists; it was renamed core3_beta when the mesh was swapped.


general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    # ICMGG suffix left at the awiesm3.yaml default (_v2). The lakeless CORE3_v2 of
    # 2026-08-25 was moved aside as _v2_nolakes on 2026-09-08 and _v2 now carries
    # the lake-restored file that was briefly published as _v3.
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "08:00:00"
    initial_date: "1350-01-01"
    final_date: "1390-01-01"  # 40 yr, four 10-year legs.
    # mean showed the TOA drift SATURATES near +0.9 by about 1370 rather than rising
    # linearly, so the quantity to measure is the plateau level and the equilibrium it
    # implies, not a drift rate.  A Gregory regression on the last 50 years (1400-1449)
    # gives that; 40 years cannot, because half of it is the approach.
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 0
    nyear: 10
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    resolution: "CORE3"
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 10
    restart_unit: 'y'
    restart_first: 10
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "core3_linfs"
    ini_parent_date: "1959-12-31"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/core3_linfs"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.1959.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.1959.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    # PINNED 2026-08-24.  bin/guess is whatever was built last, and a rebuild on
    # 08-23 21:48 replaced it with a tree whose hardened land-cover checks reject
    # the shared 1350 state (1e-9 tolerance against floating-point stand sums).
    # 11V crashlooped all three legs on it.  This arm STAGED md5 f687355919dc0b18b511e10560899bae,
    # verified against the guess in its own run directory, so it is pinned to the
    # binary it actually ran.  An unpinned default is a dependency nothing enforces.
    # RE-PINNED 2026-08-26 evening, see HANDOFF_lpjg_respin_core3.md.  The old state
    # (a270270's CRUNCEP+CERES spin-up, 11538 L096 cells, pre-4.1.11 binary) fails two
    # mesh-independent 4.1.11 checks: the fixed-peat invariant (no peat stands in the
    # state) and "refusing to cold-start" for the 11313-cell coastline gridlist.  The
    # state below is the 2000-yr re-spin under 4.1.11 on the new mask (LF2 forcing).
    # Binary = branch tip 917c4a4 (4.1.11 + coastline gridlist + Raupach + the first-day
    # soil-init guard), md5 dc32c2fcfdbca91704871dbcff826bd3; the old
    # guess.4111_landgrid_raupach (4b46d356) fails on a cold start of any new stand.
    executable: guess.4111_landgrid_raupach_softinit
    # 47 coastline cells LUH3 never covered (Caspian, Aral, Great Lakes, rift lakes,
    # Arctic islands) must be authorised NATURAL or 4.1.11 kills the rank.  11X's first
    # attempt already logged "LUH3: all 12 required state fields are missing".
    file_luh3_natural_override: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/luh3_natural_override_TCO95_CORE3.txt
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "CORE3_2000y_LF2_4111"
    ini_parent_date: "3900-12-31"
    # DO NOT SUBMIT before this directory holds lpjg_state_3901 with 1280 files AND
    # scripts/analysis/lpjg_rank_outcomes.py reports every rank ok for that run.
    ini_restart_dir: "/work/bb1469/a270092/runtime/lpjg-spinup-develop/CORE3_2000y_LF2_4111/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            # 11Q: stable-BL mixing.  New namelist group; see the header.
            NAMVDFS:
                RSBLB: 2.0
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                # 11W: S4 REMOVED, the 1850 twin of 11V.  Only change from 11Q.
                RCL_INPPMIN: 70000.0
                RSNOWLIN2: 0.04        # 11N: LX4's lever
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    # lresume true branches from EXISTING OASIS restarts. It must stay true: with
    # lresume false esm_runscripts writes EXPOUT rather than EXPORTED into the
    # namcouple (src/esm_runscripts/oasis.py:109-113) and builds the restarts by
    # dumping every coupling exchange to disk, which reached 36 GB after two model
    # months in the core3y1 bring-up and slowed as the files grew.
    #
    # The pool has no rstas.nc/rstos.nc for the new mesh: TCO95-CORE3/1024 carries
    # the remapping weights only. Branch from core3y1 instead, which completed a
    # year on this mesh at the same FESOM nproc 1024. The restarts hold coupling
    # field values on the exchange grids, so they do not depend on which_ale, and
    # core3y1 being zstar does not disqualify them here.
    lresume: true
    # NO ini_restart_dir here, deliberately. It used to point at
    # core3y1/restart/oasis3mct to supply rstas.nc/rstos.nc, which the new-mesh pool
    # lacked. That directory also holds five rmp_*.nc, and they came along and
    # shadowed esm_tools' nproc-keyed lookup (rmp: ${input_dir}/${fesom.nproc}/rmp_*.nc).
    # core3z1800 made them at dist_512, core3y1 ran dist_1024 on them and 11X dist_1792:
    # every OASIS field then landed on the wrong nodes. FESOM applied +341 W/m2 of
    # tropical heat LOSS against +22.7 of gain received, uncorrelated (r = -0.13), and
    # 1513 tropical nodes fell below 10 C until the shelves blew up.
    # The pool now has a matched set per partition, built with AWI-ESM/oasis_reorder_tool
    # from core3z1800's own dist_512 output (the one source with clean provenance:
    # lresume false, so it generated its weights from scratch at the partition it ran).
    # Verified end-to-end by 11Xt512: tropical fh -13.7/-20.5/-32.5 against 11W's
    # -3.3/-15.2/-27.6, and zero tropical nodes below 10 C.
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
