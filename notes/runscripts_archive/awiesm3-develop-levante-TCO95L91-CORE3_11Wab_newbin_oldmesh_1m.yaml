# ---------------------------------------------------------------------------------
# A/B TEST 2026-08-27: TODAY'S COUPLED BINARIES ON THE OLD MESH, 11W's exact configuration,
# ONE MONTH.  Purpose: decide whether the ~+370 W/m2 tropical ocean heat LOSS seen on the
# corrected CORE3 (core3y1 month 1, 11X) comes from the 2026-08-26 FESOM merge of main
# f4150b1d (binary) or from the new-mesh inputs.  The OASIS exchange dumps of core3y1
# show OpenIFS sending and FESOM receiving correct fluxes at the correct nodes; the
# damage is inside FESOM after receipt.  11W (fh tropics -8 W/m2 in month 1) ran on
# libfesom.so built 08-23 (pre-merge, md5 a1293118); 11X/core3y1 on the 08-26 build.
# Read: fh.fesom.1350.nc tropical mean of month 1.  ~-8 => inputs; ~+370 => binary.
# Everything below 11W's, except: one month, old mesh selected explicitly, OASIS restart
# branched from 11W's own restart directory.
# ---------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------
# 11W = 11Q with S4 REMOVED (RCL_INPPMIN 50000 -> 70000).  The 1850 TWIN of 11V.
#
# WHY A TWIN AND NOT JUST 11V.  11V is 1990-forced, and the energy question that decides
# S4's fate is a PI question.  The absolute TOA of a 1990 run carries roughly +0.6 W/m2 of
# present-day forcing -- 11R sits at +0.547 over 1352-59 where 11Q sits at -0.079 -- so it
# cannot be read against the +-0.3 PI target.  Inferring PI behaviour by subtracting an
# estimated forcing offset from a 1990 run is exactly the kind of step this campaign has
# got wrong before.  This measures it directly.
#
# WHAT THE 1850 ARMS ACTUALLY SHOW, and it corrects a number quoted all week.  The PI
# controls do NOT carry a standing +0.88 W/m2 imbalance.  They START near zero and DRIFT:
#
#     arm   1352-59   1380-89
#     11N    -0.057    +0.941
#     11Q    -0.079    +0.998
#
# So the energy problem is a 40-year DRIFT of about +1.0 W/m2, not an initial offset.  A
# TOA that drifts POSITIVE while the system warms is backwards for a damped system, and
# the cause is the ice-albedo feedback: SH September ice falls ~2e6 km2 over the same 40
# years in every arm, 1850 and 1990 alike, albedo drops, absorption rises.  The Southern
# Ocean drift IS the TOA bias rather than a consequence of it.
#
# WHY THAT MAKES THIS ARM INTERESTING RATHER THAN JUST BOOKKEEPING.  At 8 years 11V-11R
# gives net TOA +0.475, which on a PI base would move the start from -0.08 to about +0.39,
# outside the +-0.3 target.  But the same 8 years give SW CRE -3.362* at 90-60S ocean DJF,
# i.e. removing S4 BRIGHTENS the polar band by a quarter of its +13.36 deficit -- and the
# polar band is what feeds the ice loss that drives the drift.  So the +0.39 may be repaid
# by a slower drift.  Only a 40-year PI arm can show that; a 1990 arm cannot.
#
# WHAT ELSE 11V-11R GAVE AT 8 YEARS (preliminary, thresholds wide):
#     subAnt 60-45S DJF SW CRE  +3.450*  -- the overcorrection blocking every SH-wide
#                                           lever goes from -3.70 to about -0.25
#     Siberia JJA T2m           +0.392   -- ns, but the right sign; the falsifier that
#                                           would have KEPT S4 has not fired
#     all land ANN T2m          +0.297*
#
# READ AT 40 YEARS: the drift rate, dTOA/dt and d(Sep ice)/dt against 11Q, is the number
# this arm exists for.  The 8-year snapshot cannot see it.
#
# CONTROL: 11Q, 40 yr, same binary (guess.raupach_junebase_gated, md5
# f687355919dc0b18b511e10560899bae, pinned in both), same 1350 state, one namelist number.
# ---------------------------------------------------------------------------------

general:
    user: !ENV ${USER}
    install_esm_tools_branch: 'feat/awiesm3-v3.4-co2'
    setup_name: "awiesm3"
    version: "develop"
    account: "ab0246"
    compute_time: "01:30:00"
    initial_date: "1350-01-01"
    final_date: "1350-02-01"   # A/B: one month  # 100 yr.  Extended 2026-08-24 from 1390: the decadal Kaiser
    # mean showed the TOA drift SATURATES near +0.9 by about 1370 rather than rising
    # linearly, so the quantity to measure is the plateau level and the equilibrium it
    # implies, not a drift rate.  A Gregory regression on the last 50 years (1400-1449)
    # gives that; 40 years cannot, because half of it is the approach.
    base_dir: "/work/bb1469/${user}/runtime/${general.setup_name}-v3.4/"
    nday: 0
    nmonth: 1
    nyear: 0
    use_venv: False
    # Raise per-process FD limit before model launch to avoid LPJ restart
    # failures when opening many state shards plus forcing NetCDF files.
    pre_run_commands: "ulimit -n 262144 || ulimit -n 65535 || true"

computer:
    taskset: true

awiesm3:
    postprocessing: false
    model_dir: "/work/ab0246/${user}/model_codes/${general.setup_name}-${general.version}/"

fesom:
    # OLD mesh (211567 nodes).  The pool symlink fesom2/CORE3 now points at the corrected
    # mesh, so the old one is selected by name: it drives the OASIS dir (TCO95-core3_beta),
    # ICMGGab45INIT_core3_beta_v2, slt_TCO95_core3_beta.nc and runoff_maps_core3_beta.
    resolution: "core3_beta"
    mesh_dir: "/work/ab0246/a270092/input/fesom2/core3_beta/"
    # fesom-2.7.yaml has no choose_resolution entry for core3_beta; these are CORE3's
    # values with the old node count (nx is only bookkeeping for the parser).
    nx: 211567
    whichEVP: 1
    alpha_evp: 300
    beta_evp: 300
    time_step: 1200
    nproc: 1792
    omp_num_threads: 1
    lresume: true
    restart_rate: 1
    restart_unit: 'm'
    restart_first: 1
    tar_binary_restarts: false
    with_cavity: true
    vis_sync: false
    # 06T mixed-layer stack (identical to 09C/11A)
    add_namelist_changes:
        namelist.ice:
            meltpond:
                pndaspect: 1.3
                rfracmax: 0.75
                albpnd: 0.28
        namelist.tra:
            tracer_phys:
                use_momix: true
                momix_kv: 0.01
        namelist.cvmix:
            param_kpp:
                kpp_av0: 0.003
                kpp_kv0: 0.003
                kpp_avbckg: 5.0e-05
                kpp_kvbckg: 5.0e-06
        namelist.oce:
            oce_dyn:
                spp: false
    ini_parent_exp_id: "CORE3_restart"
    ini_parent_date: "2000-01-01"
    ini_restart_dir: "/work/ab0246/a270092/input/fesom2/restart/core3_beta"
    choose_general.run_number:
        1:
            restart_in_sources:
                par_oce_restart: /${ini_restart_dir}/fesom.2000.oce.restart/*.nc
                par_ice_restart: /${ini_restart_dir}/fesom.2000.ice.restart/*.nc
    further_reading:
        - fesom.tripyview.yaml
    cmip7_cmor_output: True

lpj_guess:
    # PINNED 2026-08-24.  bin/guess is whatever was built last, and a rebuild on
    # 08-23 21:48 replaced it with a tree whose hardened land-cover checks reject
    # the shared 1350 state (1e-9 tolerance against floating-point stand sums).
    # 11V crashlooped all three legs on it.  This arm STAGED md5 f687355919dc0b18b511e10560899bae,
    # verified against the guess in its own run directory, so it is pinned to the
    # binary it actually ran.  An unpinned default is a dependency nothing enforces.
    executable: guess.raupach_junebase_gated
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability"
    ini_parent_date: "3900-12-31"
    ini_restart_dir: "/work/bb1469/a270270/runtime/lpjg-spinup/LPJG-SPINUP_2000Y_TCO95_CORE3_CRUNCEPandCERES_daily_variability/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
            restart_in_sources:
                state: /${ini_restart_dir}/lpjg_state_3901/*
            restart_in_in_work:
                state: lpjg_state_${initial_date!syear}/*
    # Soil-temperature sensitivity: pin the modified template explicitly so
    # every LPJ-GUESS rank uses useifssoiltemp=1, independent of which
    # ESM-Tools checkout provides esm_runscripts on PATH.
    add_config_sources:
        "guess_ins_[[proc_list-->PROC_NUM]]": /home/a/a270092/esm_tools/namelists/lpj_guess/guess.ins.useifssoiltemp1.j2
    fixed_CO2: 1850
    fixed_ndep: 1850
    fixed_LU: 1850
    file_luh3_states: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-states_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_management: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-management_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2024_TCO95.nc
    file_luh3_transitions: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/multiple-transitions_input4MIPs_landState_CMIP_UofMD-landState-3-1-2_gn_0850-2023_TCO95.nc

oifs:
    resolution: "TCO95"
    levels: "L91"
    prepifs_expid: ab45
    input_expid: awi3
    wam: true
    time_step: 3600
    nproc: 384
    omp_num_threads: 4
    mip: cmip7
    scenario: piControl
    lresume: false
    cmip7_cmor_output: True
    add_namelist_changes:
        fort.4:
            # 11Q: stable-BL mixing.  New namelist group; see the header.
            NAMVDFS:
                RSBLB: 2.0
            NAMCLDP:
                RVICE: 0.16
                RCL_INPSEA: 0.2
                # 11W: S4 REMOVED, the 1850 twin of 11V.  Only change from 11Q.
                RCL_INPPMIN: 70000.0
                RSNOWLIN2: 0.04        # 11N: LX4's lever
            NAMGWWMS:
                GGAUSSB: -0.5
            NAEPHY:
                LRDALB: False        # Coupled albedo on (LPJG-driven)
            NAMCUMF:
                ENTSTPC3: 1          # retained from 09C
            NAMSURFTUNE:
                "ECE_TUNE_RVRSMIN(3)": 1000.0
                "ECE_TUNE_RVRSMIN(4)": 1000.0
                "ECE_TUNE_RVRSMIN(9)": 225.0
                ECE_SNOW_SCF: 3
                ECE_SNOW_SCF_RHOREF: 200.0
                ECE_SNOW_SCF_DCL: 0.014
                ECE_SNOW_SCF_DCH: 0.026
                ECE_SNOW_SCF_MD: 4.70
                ECE_SNOW_SCF_BL: 1.46
                ECE_SNOW_SCF_BH: 0.40
                ECE_SNOW_SCF_DCMAX: 0.30
                ECE_SNOW_SCF_SCALE: 1.0
                # 11E change 1: the autumn snow-mass floor, 30 -> 15.
                ECE_SNOW_SCF_SWEMIN: 15.0
                # --- K1: snow-free land albedo, vegetation types 1 / 10 / 11 only.
                # Tundra is DELIBERATELY EXCLUDED so K1 stays orthogonal to the boreal
                # levers and adds no absorbed shortwave to the Arctic: 60-90N net TOA
                # stays at -97.463 against a control -97.737 and CERES -97.98.  Do not
                # add tundra entries -- they compete for the same Arctic energy budget.
                "ECE_TUNE_RVVEGALB(1,1)": 0.023500
                "ECE_TUNE_RVVEGALB(1,2)": 0.030240
                "ECE_TUNE_RVVEGALB(1,3)": 0.252561
                "ECE_TUNE_RVVEGALB(1,4)": 0.284663
                "ECE_TUNE_RVVEGALB(10,1)": 0.022748
                "ECE_TUNE_RVVEGALB(10,2)": 0.026933
                "ECE_TUNE_RVVEGALB(10,3)": 0.234026
                "ECE_TUNE_RVVEGALB(10,4)": 0.253862
                "ECE_TUNE_RVVEGALB(11,1)": 0.047943
                "ECE_TUNE_RVVEGALB(11,2)": 0.078395
                "ECE_TUNE_RVVEGALB(11,3)": 0.185338
                "ECE_TUNE_RVVEGALB(11,4)": 0.262827
                # --- K1: bare-soil background scale, all four components ---
                "ECE_TUNE_SOILALB(1)": 0.95
                "ECE_TUNE_SOILALB(2)": 0.95
                "ECE_TUNE_SOILALB(3)": 0.95
                "ECE_TUNE_SOILALB(4)": 0.95
    add_input_files:
        dust_clim: dust_clim
    add_input_sources:
        dust_clim: '/work/ab0246/a270092/input/oifs-48r1/cmip7-data/dust/onlinedust_v4_rmp.nc'
    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    lresume: true
    time_step: 3600       # 1 hour coupling (06T/06V stack)
    ini_parent_exp_id: "11W"
    ini_restart_dir: "/work/bb1469/a270092/runtime/awiesm3-v3.4/11W/restart/oasis3mct/"

xios:
