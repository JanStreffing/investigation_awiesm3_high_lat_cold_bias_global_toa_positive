lpj_guess:
    # PINNED 2026-08-24.  bin/guess is whatever was built last, and a rebuild on
    # 08-23 21:48 replaced it with a tree whose hardened land-cover checks reject
    # the shared 1350 state (1e-9 tolerance against floating-point stand sums).
    # 11V crashlooped all three legs on it.  This arm STAGED md5 f687355919dc0b18b511e10560899bae,
    # verified against the guess in its own run directory, so it is pinned to the
    # binary it actually ran.  An unpinned default is a dependency nothing enforces.
    # RE-PINNED 2026-08-26 evening, see HANDOFF_lpjg_respin_core3.md.  The old state
    # (a270270's CRUNCEP+CERES spin-up, 11538 L096 cells, pre-4.1.11 binary) fails two
    # mesh-independent 4.1.11 checks: the fixed-peat invariant (no peat stands in the
    # state) and "refusing to cold-start" for the 11313-cell coastline gridlist.  The
    # state below is the 2000-yr re-spin under 4.1.11 on the new mask (LF2 forcing).
    # Binary = branch tip 917c4a4 (4.1.11 + coastline gridlist + Raupach + the first-day
    # soil-init guard), md5 dc32c2fcfdbca91704871dbcff826bd3; the old
    # guess.4111_landgrid_raupach (4b46d356) fails on a cold start of any new stand.
    executable: guess.4111_landgrid_raupach_softinit
    # 47 coastline cells LUH3 never covered (Caspian, Aral, Great Lakes, rift lakes,
    # Arctic islands) must be authorised NATURAL or 4.1.11 kills the rank.  11X's first
    # attempt already logged "LUH3: all 12 required state fields are missing".
    file_luh3_natural_override: /work/ab0246/a270092/input/lpj-guess/land_use/TCO95/luh3_natural_override_TCO95_CORE3.txt
    resolution: "TCO95"
    mip: cmip7
    scenario: piControl
    daily_output: true
    nproc: 64
    omp_num_threads: 4
    lresume: true
    ini_parent_exp_id: "CORE3_2000y_LF2_4111"
    ini_parent_date: "3900-12-31"
    # DO NOT SUBMIT before this directory holds lpjg_state_3901 with 1280 files AND
    # scripts/analysis/lpjg_rank_outcomes.py reports every rank ok for that run.
    ini_restart_dir: "/work/bb1469/a270092/runtime/lpjg-spinup-develop/CORE3_2000y_LF2_4111/run_19000101-38991231/work/"
    choose_general.run_number:
        1:
