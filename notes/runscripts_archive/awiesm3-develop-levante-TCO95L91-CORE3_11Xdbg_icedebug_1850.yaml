    add_input_in_work:
        dust_clim: 'composition/onlinedust_v4_rmp.nc'

oasis3mct:
    use_lucia: false
    # lresume true branches from EXISTING OASIS restarts. It must stay true: with
    # lresume false esm_runscripts writes EXPOUT rather than EXPORTED into the
    # namcouple (src/esm_runscripts/oasis.py:109-113) and builds the restarts by
    # dumping every coupling exchange to disk, which reached 36 GB after two model
    # months in the core3y1 bring-up and slowed as the files grew.
    #
    # The pool has no rstas.nc/rstos.nc for the new mesh: TCO95-CORE3/1024 carries
    # the remapping weights only. Branch from core3y1 instead, which completed a
    # year on this mesh at the same FESOM nproc 1024. The restarts hold coupling
    # field values on the exchange grids, so they do not depend on which_ale, and
    # core3y1 being zstar does not disqualify them here.
    lresume: true
    # NO ini_restart_dir here, deliberately. It used to point at
    # core3y1/restart/oasis3mct to supply rstas.nc/rstos.nc, which the new-mesh pool
    # lacked. That directory also holds five rmp_*.nc, and they came along and
    # shadowed esm_tools' nproc-keyed lookup (rmp: ${input_dir}/${fesom.nproc}/rmp_*.nc).
    # core3z1800 made them at dist_512, core3y1 ran dist_1024 on them and 11X dist_1792:
    # every OASIS field then landed on the wrong nodes. FESOM applied +341 W/m2 of
    # tropical heat LOSS against +22.7 of gain received, uncorrelated (r = -0.13), and
    # 1513 tropical nodes fell below 10 C until the shelves blew up.
    # The pool now has a matched set per partition, built with AWI-ESM/oasis_reorder_tool
    # from core3z1800's own dist_512 output (the one source with clean provenance:
    # lresume false, so it generated its weights from scratch at the partition it ran).
    # Verified end-to-end by 11Xt512: tropical fh -13.7/-20.5/-32.5 against 11W's
    # -3.3/-15.2/-27.6, and zero tropical nodes below 10 C.
    time_step: 3600       # 1 hour coupling (06T/06V stack)

xios:
    with_model:
        - oifs
        - fesom
    nproc: 16
    omp_num_threads: 128
    compression_level: 3
