# ---------------------------------------------------------------------------------
# 11Xdbg = 11X for ONE year, with the coupled-slab skin solve instrumented.
#
# THE QUESTION.  11X shows 341401 points in year 1350 with ice surface temperature below
# 200 K, minimum 110 K, at REAL ice (median a_ice 0.98, not phantom slivers), in both
# hemispheres, peaking in each winter, where snow is 0.416 m against 0.106 m elsewhere.
# The floor that used to hide this (ice_temp=271.35 when <173.15) was removed by 84368450
# on 2026-08-20; that commit has only ever executed in 11Y, so nothing before it could
# report the divergence and the clean -is years prove nothing either way.
#
# THE SOLVE (ice_thermo_cpl.F90:ice_surftemp):
#     zlam = 4*emiss*sigma*tref**3 + zlam_turb      ! zlam_turb = 16, and dominates
#     t    = (zcpdte*t + a2ihf + zlam*tref + zicefl) / (zcpdte + con/zsniced + zlam)
# Thick snow drives con/zsniced -> 0, so the conduction anchor drops out and the steady
# state is t = tref + a2ihf/zlam. With zlam ~ 16 that needs a2ihf ~ -2200 W/m2 to reach
# 110 K. Two hypotheses, and they lead to different files:
#
#   H1  a2ihf really is kilowatt-scale -> Bug IV recurring, fix on the OIFS side.
#   H2  a2ihf is sane (-60..-100) but the anchor is wrong. tref = ist_ref, captured at
#       the OASIS send (gen_forcing_couple.F90:475), i.e. the ist FESOM SENT. With
#       LNEMOLIMTEMP=.false. OIFS ignores that field and evaluates a2ihf at its OWN
#       independently solved skin, so the linearization is applied about a point the
#       atmosphere never used. Fix in ice_surftemp.
#
# Neither is decidable from existing output: a2ihf and ist_ref had no def_stream. Both
# were added next to qcon/qres (io_meandata.F90, inside the __oifs block) and are
# requested daily below, alongside a daily qcon so it can be compared with the daily ist.
#
# READ IT AS: scatter a2ihf against ist at the sub-200 K points. H1 gives a2ihf in the
# thousands. H2 gives sane a2ihf with (ist - istref) growing as the skin drifts.
#
# One year is enough -- the divergence is present from 1350 in 11X with 341401 points.
# Otherwise identical to 11X: same mesh, same restart, same LPJ-GUESS, same 1792 OASIS
# set, same switch set (LNEMOSICOUP=.false. LNEMOLIMTEMP=.false. LNEMOLIMTHK=.true.
# LMCCDYNSEAICE=.true., all verified in 11X's staged fort.4). FESOM library differs:
# this stages dbdd095e8b4e (main + the two diagnostics), 11X holds 3928171205fe.



